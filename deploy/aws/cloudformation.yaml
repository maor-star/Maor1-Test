AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ניהול הבית — אתר סטטי על S3 פרטי מאחורי CloudFront (עם Origin Access Control).
  Static single-page app hosted on a private S3 bucket served through CloudFront over HTTPS.

Parameters:
  AppName:
    Type: String
    Default: home-management
    Description: בסיס לשם ה-bucket וה-resources.
  DomainName:
    Type: String
    Default: ''
    Description: (אופציונלי) דומיין מותאם, למשל bait.wonderfool.xyz. ריק = כתובת CloudFront בלבד.
  HostedZoneId:
    Type: String
    Default: ''
    Description: (אופציונלי) מזהה ה-Route53 Hosted Zone של הדומיין (לאימות התעודה ורשומת ה-DNS).

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  # ---- S3 bucket (private; served only via CloudFront) ----
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ---- ACM certificate (DNS-validated automatically via Route53) ----
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # ---- Origin Access Control (modern replacement for OAI) ----
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ---- CloudFront distribution ----
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${AppName} static site'
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # Managed policy: CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ---- Bucket policy: allow only this CloudFront distribution to read ----
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ---- DNS records for the custom domain (alias to CloudFront) ----
  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # קבוע גלובלי ל-CloudFront aliases
        EvaluateTargetHealth: false
  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteURL:
    Description: הכתובת היפה (אם הוגדר דומיין)
    Condition: HasDomain
    Value: !Sub 'https://${DomainName}'
  BucketName:
    Description: שם ה-S3 bucket שאליו מעלים את index.html
    Value: !Ref SiteBucket
  DistributionId:
    Description: מזהה ה-CloudFront distribution (לצורך invalidation)
    Value: !Ref Distribution
  URL:
    Description: כתובת האתר החיה
    Value: !Sub 'https://${Distribution.DomainName}'

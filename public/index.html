<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ניהול משרד</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🏢</span>
        <span class="brand-name">ניהול משרד</span>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-view="dashboard"><span class="ico">📊</span> דשבורד</a>
        <a href="#/employees" data-view="employees"><span class="ico">👥</span> עובדים</a>
        <a href="#/hours" data-view="hours"><span class="ico">⏱️</span> שעות עבודה</a>
        <a href="#/expenses" data-view="expenses"><span class="ico">💸</span> הוצאות</a>
        <a href="#/income" data-view="income"><span class="ico">💰</span> הכנסות</a>
      </nav>
      <div class="sidebar-footer">מנוהל ע"י המשרד שלך</div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1 id="page-title">דשבורד</h1>
        <div class="month-picker">
          <label for="month-filter">חודש:</label>
          <input type="month" id="month-filter" />
          <button id="clear-month" class="btn-ghost" title="הצג הכל">הכל</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>

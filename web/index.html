<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>ניהול הבית</title></head><body>
<title>ניהול הבית</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
/* ============ Home OS — premium hi-tech design system ============ */
:root{
  /* light (crisp, cool, Linear-style) */
  --bg:#eef1f6; --bg-glow:rgba(45,212,191,.10);
  --surface:#ffffff; --surface-2:#f4f6fb; --surface-3:#eef1f7;
  --text:#0f1729; --muted:#5b6675; --faint:#8a94a3; --border:#e3e8f0;
  --accent:#0d9488; --accent-2:#0284c7; --accent-strong:#0b7d72; --on-accent:#ffffff;
  --grad:linear-gradient(135deg,#0d9488,#0284c7);
  --grad-soft:linear-gradient(135deg,rgba(13,148,136,.12),rgba(2,132,199,.12));
  --green:#0f9d58; --amber:#c2740a; --red:#d93a4a; --income:#0f9d58;
  --chip:#eef2f8;
  --shadow:0 1px 2px rgba(15,23,41,.05), 0 8px 24px -8px rgba(15,23,41,.10);
  --shadow-lg:0 2px 6px rgba(15,23,41,.06), 0 24px 50px -18px rgba(15,23,41,.22);
  --glow:0 0 0 1px rgba(13,148,136,.18), 0 8px 30px -8px rgba(13,148,136,.28);
  --sidebar-1:#0b1220; --sidebar-2:#111a2e;
  --radius:16px; --radius-sm:11px;
}
@media (prefers-color-scheme:dark){ :root{
  --bg:#070b12; --bg-glow:rgba(45,212,191,.14);
  --surface:#0f1622; --surface-2:#131c2b; --surface-3:#0c1320;
  --text:#e8eef7; --muted:#93a1b5; --faint:#63718a; --border:#1e2a3d;
  --accent:#2dd4bf; --accent-2:#38bdf8; --accent-strong:#5eead4; --on-accent:#04141a;
  --grad:linear-gradient(135deg,#2dd4bf,#38bdf8);
  --grad-soft:linear-gradient(135deg,rgba(45,212,191,.14),rgba(56,189,248,.14));
  --green:#34d399; --amber:#fbbf24; --red:#fb7185; --income:#34d399;
  --chip:#182334;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.55);
  --shadow-lg:0 2px 8px rgba(0,0,0,.45), 0 30px 60px -20px rgba(0,0,0,.7);
  --glow:0 0 0 1px rgba(45,212,191,.22), 0 10px 40px -8px rgba(45,212,191,.30);
  --sidebar-1:#070c15; --sidebar-2:#0b1322;
}}
:root[data-theme="light"]{
  --bg:#eef1f6; --bg-glow:rgba(45,212,191,.10);
  --surface:#ffffff; --surface-2:#f4f6fb; --surface-3:#eef1f7;
  --text:#0f1729; --muted:#5b6675; --faint:#8a94a3; --border:#e3e8f0;
  --accent:#0d9488; --accent-2:#0284c7; --accent-strong:#0b7d72; --on-accent:#ffffff;
  --grad:linear-gradient(135deg,#0d9488,#0284c7); --grad-soft:linear-gradient(135deg,rgba(13,148,136,.12),rgba(2,132,199,.12));
  --green:#0f9d58; --amber:#c2740a; --red:#d93a4a; --income:#0f9d58; --chip:#eef2f8;
  --shadow:0 1px 2px rgba(15,23,41,.05), 0 8px 24px -8px rgba(15,23,41,.10);
  --shadow-lg:0 2px 6px rgba(15,23,41,.06), 0 24px 50px -18px rgba(15,23,41,.22);
  --glow:0 0 0 1px rgba(13,148,136,.18), 0 8px 30px -8px rgba(13,148,136,.28);
  --sidebar-1:#0b1220; --sidebar-2:#111a2e;
}
:root[data-theme="dark"]{
  --bg:#070b12; --bg-glow:rgba(45,212,191,.14);
  --surface:#0f1622; --surface-2:#131c2b; --surface-3:#0c1320;
  --text:#e8eef7; --muted:#93a1b5; --faint:#63718a; --border:#1e2a3d;
  --accent:#2dd4bf; --accent-2:#38bdf8; --accent-strong:#5eead4; --on-accent:#04141a;
  --grad:linear-gradient(135deg,#2dd4bf,#38bdf8); --grad-soft:linear-gradient(135deg,rgba(45,212,191,.14),rgba(56,189,248,.14));
  --green:#34d399; --amber:#fbbf24; --red:#fb7185; --income:#34d399; --chip:#182334;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -10px rgba(0,0,0,.55);
  --shadow-lg:0 2px 8px rgba(0,0,0,.45), 0 30px 60px -20px rgba(0,0,0,.7);
  --glow:0 0 0 1px rgba(45,212,191,.22), 0 10px 40px -8px rgba(45,212,191,.30);
  --sidebar-1:#070c15; --sidebar-2:#0b1322;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Assistant","Rubik","Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew",sans-serif;
  color:var(--text); direction:rtl; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 620px at 88% -8%, var(--bg-glow), transparent 60%),
    radial-gradient(900px 520px at 0% 108%, var(--grad-soft), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select,textarea{font-family:inherit; color:inherit}
a{color:var(--accent); text-decoration:none}
.tnum{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 34%,transparent);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 55%,transparent);background-clip:padding-box}

.app{display:flex; min-height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  width:256px; flex-shrink:0; display:flex; flex-direction:column; padding:18px 14px;
  position:sticky; top:0; height:100vh; color:#c3cede;
  background:linear-gradient(180deg,var(--sidebar-2),var(--sidebar-1));
  border-inline-start:1px solid rgba(255,255,255,.06);
  box-shadow:8px 0 40px -20px rgba(0,0,0,.6);
}
.brand{display:flex; align-items:center; gap:12px; padding:8px 10px 20px}
.brand-logo{
  font-size:22px; width:42px; height:42px; display:grid; place-items:center; border-radius:13px;
  background:var(--grad); box-shadow:0 8px 22px -6px color-mix(in srgb,var(--accent) 60%,transparent);
}
.brand-name{font-size:18px; font-weight:800; color:#fff; letter-spacing:.2px; display:block; line-height:1.1}
.brand-sub{font-size:10.5px; color:#7f8ea6; margin-top:3px; letter-spacing:.06em; text-transform:uppercase}
nav{display:flex; flex-direction:column; gap:3px; overflow-y:auto; margin-top:4px}
nav a{
  position:relative; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px;
  color:#9aa8bf; font-weight:600; font-size:13.5px; cursor:pointer; transition:.16s ease;
}
nav a .ico{font-size:16px; width:26px; height:26px; display:grid; place-items:center; border-radius:8px; background:rgba(255,255,255,.05); transition:.16s}
nav a:hover{background:rgba(255,255,255,.05); color:#eaf1fb}
nav a:hover .ico{background:rgba(255,255,255,.10)}
nav a.active{background:color-mix(in srgb,var(--accent) 15%,transparent); color:#fff}
nav a.active .ico{background:var(--grad); color:var(--on-accent); box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
nav a.active::before{content:""; position:absolute; inset-inline-start:-14px; top:9px; bottom:9px; width:3px; border-radius:3px; background:var(--grad)}
.sidebar-foot{margin-top:auto; padding-top:14px; font-size:11px; color:#67748c; display:flex; justify-content:space-between; align-items:center; gap:8px}
.theme-btn{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); color:#c3cede; border-radius:9px; padding:6px 11px; cursor:pointer; font-size:13px; transition:.15s}
.theme-btn:hover{background:rgba(255,255,255,.14)}

/* ---------- Content ---------- */
.content{flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  padding:15px 30px; position:sticky; top:0; z-index:20;
  background:color-mix(in srgb,var(--surface) 88%,var(--bg)); backdrop-filter:blur(16px) saturate(1.5);
  border-bottom:1px solid var(--border);
}
.topbar h1{font-size:20px; font-weight:800; margin:0; letter-spacing:-.01em; color:var(--text)}
.month-picker{display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); background:var(--surface); border:1px solid var(--border); padding:5px 6px 5px 12px; border-radius:13px; box-shadow:var(--shadow)}
.month-picker>label{font-weight:700; color:var(--text)}
.month-picker input{padding:8px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); color:var(--text); font-weight:700; font-family:inherit; color-scheme:light dark; min-width:130px}
:root[data-theme="light"] .month-picker input{color-scheme:light}
:root[data-theme="dark"] .month-picker input{color-scheme:dark}
.month-picker input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.month-picker input::-webkit-calendar-picker-indicator{cursor:pointer; opacity:.65}
.month-picker input::-webkit-calendar-picker-indicator:hover{opacity:1}
:root[data-theme="dark"] .month-picker input::-webkit-calendar-picker-indicator{filter:invert(.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .month-picker input::-webkit-calendar-picker-indicator{filter:invert(.85)}}
.view{padding:28px 34px 56px; width:100%; max-width:1460px; margin-inline:auto; animation:viewIn .32s cubic-bezier(.22,.9,.3,1)}
@media (max-width:1200px){.view{padding:24px 22px 48px}}
@keyframes viewIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ---------- Stat cards ---------- */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-bottom:24px}
.stat-card{
  position:relative; overflow:hidden; padding:19px 20px; border-radius:var(--radius);
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  border:1px solid var(--border); box-shadow:var(--shadow); transition:transform .2s ease, box-shadow .2s ease, border-color .2s;
}
.stat-card::after{content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--grad); opacity:.9}
.stat-card::before{content:""; position:absolute; top:-40%; inset-inline-start:-20%; width:180px; height:180px; border-radius:50%; background:var(--grad-soft); filter:blur(30px); opacity:.7; pointer-events:none}
.stat-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.stat-card .label{color:var(--muted); font-size:11.5px; font-weight:700; margin-bottom:11px; display:flex; align-items:center; gap:7px; letter-spacing:.04em; text-transform:uppercase}
.stat-card .value{font-size:27px; font-weight:800; letter-spacing:-.02em; line-height:1}
.stat-card .sub{font-size:12px; color:var(--muted); margin-top:8px}
.stat-card.expense::after{background:linear-gradient(135deg,var(--red),#f0883e)} .stat-card.expense .value{color:var(--red)}
.stat-card.income::after{background:linear-gradient(135deg,var(--green),#22d3ee)} .stat-card.income .value{color:var(--income)}
.stat-card.warn::after{background:linear-gradient(135deg,var(--amber),#f97316)} .stat-card.warn .value{color:var(--amber)}
.stat-card.accent .value{background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}

/* ---------- Panels ---------- */
.panels{display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:stretch}
@media (max-width:1080px){.panels{grid-template-columns:1fr}}
.panel{padding:22px 22px 20px; border-radius:var(--radius); background:linear-gradient(180deg,var(--surface),var(--surface-2)); border:1px solid var(--border); box-shadow:var(--shadow); transition:box-shadow .25s cubic-bezier(.22,.9,.3,1), border-color .25s, transform .25s; display:flex; flex-direction:column; min-width:0}
.panel>.chart-box,.panel>.table-wrap{margin-top:auto; margin-bottom:auto}
/* קריטי למובייל: אפשר לגריד/פלקס להתכווץ מתחת לרוחב-התוכן של ה-SVG (viewBox) כדי שהעמוד לא יימתח */
.panels>*{min-width:0} .stats-grid>*{min-width:0} .chart-box{min-width:0; max-width:100%}
.panel svg{max-width:100%}
.panel:hover{box-shadow:var(--shadow-lg); border-color:color-mix(in srgb,var(--accent) 22%,var(--border))}
.panel h3{font-size:14px; margin:0 0 18px; padding-bottom:13px; border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent); font-weight:800; letter-spacing:-.01em; display:flex; align-items:center; gap:8px}
/* גרף SVG בתוך פאנל — ממלא את רוחב הפאנל בגובה מידתי, בלי שוליים ריקים */
.panel svg{display:block; width:100%; height:auto}
.chart-box{position:relative; width:100%}
.chart-box svg [data-tip]{cursor:crosshair}
#chart-tip{position:fixed; z-index:220; pointer-events:none; background:linear-gradient(135deg,#0b1322,#111a2e); color:#fff; border:1px solid rgba(255,255,255,.14); padding:8px 12px; border-radius:10px; font-size:12.5px; font-weight:600; line-height:1.55; box-shadow:0 12px 34px rgba(0,0,0,.42); opacity:0; transform:translateY(4px); transition:opacity .12s, transform .12s; white-space:pre; max-width:300px}
#chart-tip.on{opacity:1; transform:translateY(0)}
/* עוזר הבית — צ'אט */
.asst{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface-2)); border:1px solid color-mix(in srgb,var(--accent) 26%,var(--border)); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:24px}
.asst-head{display:flex; align-items:center; gap:11px; margin-bottom:14px}
.asst-avatar{width:40px; height:40px; border-radius:12px; background:var(--grad); display:flex; align-items:center; justify-content:center; font-size:21px; box-shadow:var(--glow); flex-shrink:0}
.asst-msgs{max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:6px 2px 12px}
.asst-bubble{max-width:82%; padding:11px 15px; border-radius:15px; font-size:14px; line-height:1.6; animation:pop .2s cubic-bezier(.22,.9,.3,1)}
.asst-bubble.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-inline-start-radius:5px}
.asst-bubble.me{align-self:flex-end; background:var(--grad); color:var(--on-accent); border-bottom-inline-end-radius:5px}
.asst-bubble strong{font-weight:800}
.asst-chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.asst-chip{font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); color:var(--text); cursor:pointer; transition:.15s}
.asst-chip:hover{background:var(--grad-soft); border-color:color-mix(in srgb,var(--accent) 40%,var(--border)); transform:translateY(-1px)}
.asst-input{display:flex; gap:10px; align-items:center}
.asst-input input{flex:1; padding:12px 16px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:14px; font-family:inherit}
.asst-input input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.asst-send{padding:12px 20px; border-radius:12px; border:none; background:var(--grad); color:var(--on-accent); font-weight:800; font-size:14px; cursor:pointer; font-family:inherit; transition:.15s}
.asst-send:hover{filter:brightness(1.06); transform:translateY(-1px)}
.section-head{margin:34px 0 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.section-head h2{margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:9px}
.section-head .rule{flex:1; height:1px; min-width:40px; background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 30%,transparent),transparent)}

/* ---------- Cards / tables ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.card-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; background:linear-gradient(180deg,var(--surface),transparent)}
.card-header h2{font-size:16px; margin:0; font-weight:800; letter-spacing:-.01em}
.table-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th,td{padding:12px 18px; text-align:right; white-space:nowrap}
th{background:var(--surface-2); color:var(--faint); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border); font-size:14px}
tbody tr{transition:background .12s}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.wrap,th.wrap{white-space:normal}
.empty{padding:44px 20px; text-align:center; color:var(--muted)}

.badge{display:inline-block; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:700; background:var(--grad-soft); color:var(--accent-strong)}
.amount-pos{color:var(--income); font-weight:700}
.amount-neg{color:var(--red); font-weight:700}
.pill{display:inline-block; padding:3px 11px; border-radius:999px; font-size:11.5px; font-weight:700; border:1px solid transparent}
.status-ok{background:color-mix(in srgb,var(--green) 15%,transparent); color:var(--green); border-color:color-mix(in srgb,var(--green) 30%,transparent)}
.status-soon{background:color-mix(in srgb,var(--amber) 16%,transparent); color:var(--amber); border-color:color-mix(in srgb,var(--amber) 32%,transparent)}
.status-late{background:color-mix(in srgb,var(--red) 15%,transparent); color:var(--red); border-color:color-mix(in srgb,var(--red) 30%,transparent)}
.status-none{background:var(--chip); color:var(--muted); border-color:var(--border)}

/* ---------- Buttons ---------- */
.btn,.btn-ghost,.btn-danger{font-size:13.5px; font-weight:700; cursor:pointer; border-radius:11px; padding:9px 16px; border:1px solid transparent; transition:.16s ease; letter-spacing:.01em}
.btn{background:var(--grad); color:var(--on-accent); box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 65%,transparent)}
.btn:hover{filter:brightness(1.06); transform:translateY(-1px); box-shadow:0 12px 26px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
.btn:active{transform:translateY(0)}
.btn-ghost{background:var(--surface); color:var(--accent-strong); border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2); border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.btn-danger{background:transparent; color:var(--red); border:none; padding:6px 9px}
.btn-danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
.icon-btn{background:none; border:none; cursor:pointer; font-size:15px; padding:6px 8px; border-radius:9px; color:var(--text); transition:.14s}
.icon-btn:hover{background:var(--surface-2)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.toolbar select,.toolbar input{padding:9px 12px; border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--text); font-size:13.5px; transition:.15s}
.toolbar select:focus,.toolbar input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.spacer{flex:1}

/* ---------- Modal / forms ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(6,10,18,.62); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:50; padding:18px; animation:fadeIn .16s}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal{background:linear-gradient(180deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:20px; width:100%; max-width:480px; box-shadow:var(--shadow-lg); animation:pop .2s cubic-bezier(.22,.9,.3,1); max-height:92vh; display:flex; flex-direction:column}
.modal.wide{max-width:680px}
@keyframes pop{from{transform:scale(.96) translateY(8px); opacity:0} to{transform:none; opacity:1}}
.modal-header{padding:18px 22px; border-bottom:1px solid var(--border); font-size:17px; font-weight:800; letter-spacing:-.01em}
.modal-body{padding:20px 22px; display:flex; flex-direction:column; gap:14px; overflow-y:auto}
.modal-footer{padding:15px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-start}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.02em}
.field input,.field select,.field textarea{padding:10px 13px; border:1px solid var(--border); border-radius:11px; font-size:14px; background:var(--surface); color:var(--text); transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.field-row{display:flex; gap:12px} .field-row .field{flex:1}
.field-row-3{display:flex; gap:12px} .field-row-3 .field{flex:1}
@media (max-width:560px){.field-row,.field-row-3{flex-direction:column}}

/* ---------- Bars & charts ---------- */
.bar-row{display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:13.5px; border-radius:9px; padding:2px 4px; margin-inline:-4px; transition:background .15s}
.bar-row[data-barlabel]:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.bar-label{width:130px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; background:var(--chip); border-radius:999px; height:10px; overflow:hidden}
.bar-fill{height:100%; border-radius:999px; background:var(--grad); box-shadow:0 0 12px -2px color-mix(in srgb,var(--accent) 50%,transparent); transition:width .5s cubic-bezier(.22,.9,.3,1)}
.bar-value{width:98px; flex-shrink:0; text-align:left; color:var(--muted); font-variant-numeric:tabular-nums}
.legend{display:flex; gap:10px; margin-top:12px; font-size:12px; color:var(--muted); justify-content:center; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:7px; background:var(--surface-3); border:1px solid var(--border); padding:4px 11px; border-radius:999px; font-weight:600}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block}
.chart{width:100%}

/* ---------- Review ---------- */
.hintbar{font-size:13px; color:var(--muted); margin-bottom:14px; padding:12px 15px; background:var(--grad-soft); border:1px solid color-mix(in srgb,var(--accent) 20%,var(--border)); border-radius:12px}
.review-card{border:1px solid var(--border); border-radius:15px; padding:16px 17px; margin-bottom:12px; background:linear-gradient(180deg,var(--surface),var(--surface-2)); box-shadow:var(--shadow); transition:.16s}
.review-card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.review-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:13px}
.review-merchant{font-weight:800; font-size:15.5px; letter-spacing:-.01em}
.review-meta{font-size:12.5px; color:var(--muted); margin-top:3px}
.review-amount{font-size:19px; font-weight:800; color:var(--red); white-space:nowrap}
.cat-chips{display:flex; flex-wrap:wrap; gap:7px}
.cat-chip{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 14px; cursor:pointer; font-size:13px; font-weight:700; transition:.14s; display:inline-flex; align-items:center; gap:7px}
.cat-chip:hover{border-color:var(--accent); background:var(--grad-soft); transform:translateY(-1px)}
.cat-chip .cdot{width:9px; height:9px; border-radius:50%}
.review-actions{display:flex; align-items:center; gap:12px; margin-top:13px; flex-wrap:wrap}
.chk{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); cursor:pointer}

/* ---------- Import ---------- */
.drop{border:2px dashed var(--border); border-radius:16px; padding:36px; text-align:center; color:var(--muted); background:var(--surface-2); cursor:pointer; transition:.18s}
.drop:hover,.drop.drag{border-color:var(--accent); color:var(--accent-strong); background:var(--grad-soft)}
.map-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin:16px 0}
.preview-table{max-height:300px; overflow:auto; border:1px solid var(--border); border-radius:12px}
.preview-table table{font-size:12.5px} .preview-table th{position:sticky; top:0}
.section-title{font-size:15px; font-weight:800; margin:22px 0 12px; letter-spacing:-.01em}

/* ---------- Cards grid / mini ---------- */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px}
.mini-card{background:linear-gradient(180deg,var(--surface),var(--surface-2)); border:1px solid var(--border); border-radius:15px; padding:16px 17px; box-shadow:var(--shadow); transition:.18s}
.mini-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:color-mix(in srgb,var(--accent) 28%,var(--border))}
.mini-card h4{font-size:15px; margin:0 0 7px; letter-spacing:-.01em}
.mini-card .row{font-size:13px; color:var(--muted); margin:3px 0}
.stars{color:var(--amber); letter-spacing:2px} .stars .off{opacity:.28}
.contact-actions{margin-top:12px; display:flex; gap:8px; align-items:center}
.link{color:var(--accent); font-weight:700; cursor:pointer}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.hint{font-size:12px; color:var(--muted); margin-top:4px}
code{background:var(--chip); padding:2px 7px; border-radius:6px; font-size:13px; font-family:ui-monospace,"SF Mono",Menlo,monospace}

.cat-select{padding:7px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--text); font-size:13px; font-weight:600; max-width:230px; cursor:pointer; transition:.15s}
.cat-select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.cat-select.unset{border-color:color-mix(in srgb,var(--red) 60%,var(--border)); color:var(--red); background:color-mix(in srgb,var(--red) 9%,transparent); font-weight:800}

/* images / docs */
.bulb-thumb{width:46px; height:46px; border-radius:11px; object-fit:cover; border:1px solid var(--border); cursor:zoom-in; display:inline-block; vertical-align:middle; background:var(--surface-2)}
.empty-thumb{display:inline-flex; align-items:center; justify-content:center; font-size:20px; cursor:default}
.img-uploader{display:flex; gap:14px; align-items:flex-start}
.img-prev{width:98px; height:98px; flex-shrink:0; border:1px solid var(--border); border-radius:13px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:12px}

.pro-avatar{width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid color-mix(in srgb,var(--accent) 40%,var(--border)); flex-shrink:0; background:var(--surface-2)}
.pro-avatar.ph{display:inline-flex; align-items:center; justify-content:center; font-size:24px; background:var(--grad-soft)}
.docs-list{display:flex; flex-direction:column; gap:6px}
.doc-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border:1px solid var(--border); border-radius:999px; background:var(--surface-2); color:var(--text); font:inherit; font-size:13px; cursor:pointer; transition:all .15s}
.chip:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
.chip.active{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.chip .chip-n{font-size:11px; opacity:.7; background:color-mix(in srgb,var(--text) 12%,transparent); border-radius:999px; padding:1px 7px; min-width:18px; text-align:center}
.chip.active .chip-n{background:color-mix(in srgb,var(--on-accent) 25%,transparent); opacity:.9}

/* ---------- Toast ---------- */
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(120px); background:linear-gradient(135deg,#0b1322,#111a2e); color:#fff; padding:13px 24px; border-radius:13px; border:1px solid rgba(255,255,255,.10); box-shadow:0 16px 40px rgba(0,0,0,.4); opacity:0; transition:.3s cubic-bezier(.22,.9,.3,1); z-index:100; font-weight:600; max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1}
.toast.error{background:linear-gradient(135deg,#7f1d2b,#b02234)}

<script>
/* ============================ Local data store ============================ */
const LS_KEY = 'home-mgmt-v1';
let db;
function seedDB(){
  const cats = [];
  let seq = 0;
  const addCat = (name,color,kind='expense',is_home=1)=>cats.push({id:++seq,name,kind,is_home,color,monthly_budget:0});
  [['חשמל','#f59e0b'],['מים וביוב','#0ea5e9'],['גז','#ef4444'],['ארנונה','#8b5cf6'],['ועד בית','#6366f1'],
   ['אינטרנט וטלוויזיה','#3b82f6'],['טלפון וסלולר','#06b6d4'],['ביטוח דירה ומבנה','#14b8a6'],
   ['בריכה – תחזוקה','#0891b2'],['בריכה – כימיקלים','#22d3ee'],['גינון ותחזוקת גינה','#16a34a'],
   ['השקיה וצמחייה','#65a30d'],['ניקיון ועזרת בית','#a855f7'],['תיקונים ותחזוקה','#d97706'],
   ['מכשירי חשמל וריהוט','#e11d48'],['אבטחה ומיגון','#475569'],['מזון וסופר','#f97316'],
   ['דלק ורכב','#84cc16'],['מיסים ואגרות','#7c3aed'],['אחר','#6b7280']].forEach(([n,c])=>addCat(n,c));
  addCat('משכורת','#15803d','income',0);
  addCat('הכנסה אחרת','#22c55e','income',0);
  addCat('העברה בין חשבונות','#94a3b8','expense',0);
  return {seq, categories:cats, rules:[], transactions:[], recurring:[], professionals:[], warranties:[], components:[], maintenance:[], lighting:[], documents:[]};
}
function loadDB(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
  const fresh = seedDB();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(fresh)); }catch(e){}
  return fresh;
}
let saveTimer;
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(db)); }catch(e){} }
function save(){
  db.updatedAt=Date.now();
  _hasCardDetail=null; // איפוס מטמון (ייתכן שהשתנו שורות פירוט)
  persistLocal();
  const s=document.getElementById('save-state');
  if(s && !syncCode){ s.textContent='נשמר ✔'; clearTimeout(saveTimer); saveTimer=setTimeout(()=>s.textContent='נשמר בדפדפן',1500); }
  scheduleSync();
}
/* ---------- Cloud sync (S3 + Lambda) — אוטומטי, ללא קוד ---------- */
const SYNC_API='https://cu3nr7fq95.execute-api.us-east-1.amazonaws.com';
const FIXED_SYNC_KEY='bait-home-7c3f9a1e5b2d4680c1a94f28d6'; // מפתח קבוע: כל המכשירים מסתנכרנים אוטומטית
let syncCode=FIXED_SYNC_KEY;
const hasRealData=(d)=> !!d && ['transactions','professionals','warranties','components','lighting','recurring','maintenance'].some(k=>Array.isArray(d[k])&&d[k].length>0);
let syncTimer=null, syncBusy=false, syncPending=false;
function syncBadge(txt){ const s=document.getElementById('save-state'); if(s) s.textContent=txt; }
async function pullRemote(){
  const r=await fetch(SYNC_API+'/data?code='+encodeURIComponent(syncCode));
  if(!r.ok) throw new Error('טעינה מהענן נכשלה ('+r.status+')');
  return r.json();
}
async function pushRemote(){
  if(!syncCode) return;
  if(syncBusy){ syncPending=true; return; }
  syncBusy=true; syncBadge('מסנכרן…☁️');
  try{
    const r=await fetch(SYNC_API+'/data',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({code:syncCode,data:db})});
    if(!r.ok) throw new Error(r.status);
    syncBadge('מסונכרן ☁️✓');
  }catch(e){ syncBadge('שגיאת סנכרון ⚠️'); }
  finally{ syncBusy=false; if(syncPending){ syncPending=false; scheduleSync(); } }
}
function scheduleSync(){ if(!syncCode) return; clearTimeout(syncTimer); syncTimer=setTimeout(pushRemote,1500); }
function adoptRemote(rdata){ db=rdata; ['categories','rules','transactions','recurring','professionals','warranties','components','maintenance','lighting'].forEach(k=>{ if(!Array.isArray(db[k])) db[k]=[]; }); persistLocal(); }
const SYNC_KEYS=['categories','rules','transactions','recurring','professionals','warranties','components','maintenance','lighting'];
// טביעת אצבע של התוכן בלבד (ללא חותמת הזמן) — כדי לזהות שינוי אמיתי ולא ריענון מיותר
function dataSig(d){ if(!d) return ''; try{ return JSON.stringify(SYNC_KEYS.map(k=>d[k]||[])); }catch(e){ return 'x'+(d.updatedAt||''); } }
// האם המשתמש באמצע פעולה? אז לא מרעננים כדי לא לסגור חלונות/למחוק הקלדה/לקפוץ למעלה
function userBusy(){
  if(document.querySelector('.modal-backdrop')) return true;
  const a=document.activeElement; if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
  const asst=document.getElementById('asst-msgs'); if(asst && asst.children.length>1) return true; // שיחה פעילה עם העוזר
  return false;
}
async function syncNow(){ // מיזוג יזום: הנתונים העדכניים ביותר מנצחים, אך נתונים אמיתיים לא נדרסים ע"י ריקים
  try{ const remote=await pullRemote(); const localReal=hasRealData(db), remoteReal=remote.data&&hasRealData(remote.data);
    let adopt=false;
    if(remoteReal && !localReal) adopt=true;
    else if(remoteReal && localReal && (remote.data.updatedAt||0) > (db.updatedAt||0)) adopt=true;
    if(adopt){
      // אותו תוכן בדיוק (רק חותמת זמן חדשה ממכשיר אחר) — מיישרים זמן בלבד, בלי ריענון
      if(dataSig(remote.data)===dataSig(db)){ db.updatedAt=remote.data.updatedAt||db.updatedAt; persistLocal(); syncBadge('מסונכרן ☁️✓'); return; }
      if(userBusy()){ syncBadge('מסונכרן ☁️✓'); return; } // ניקלוט בסבב הבא, לא מפריעים עכשיו
      adoptRemote(remote.data); syncBadge('מסונכרן ☁️✓'); render({keepScroll:true}); // ריענון שקט ששומר על מיקום הגלילה
    } else {
      await pushRemote();
    }
  }catch(e){ syncBadge('לא מקוון'); }
}
db = loadDB();
const uid = ()=> ++db.seq;
const clone = (x)=> JSON.parse(JSON.stringify(x));

/* date helpers replicating server SQL */
function addMonths(iso, n){
  if(!iso) return null;
  const [y,m,d] = String(iso).slice(0,10).split('-').map(Number);
  const dt = new Date(Date.UTC(y, (m-1)+Number(n||0), d));
  return dt.toISOString().slice(0,10);
}
function daysLeft(iso){ if(!iso) return null; return Math.floor((Date.parse(iso+'T00:00:00Z') - Date.now())/86400000); }
const inMonth = (iso,month)=> !month || (String(iso).slice(0,7)===month);
const numv=(v)=> (v===undefined||v===null||v==='')?0:Number(v);
const strv=(v)=> (v===undefined||v===null)?'':String(v).trim();
const intOrNull=(v)=> (v===undefined||v===null||v==='')?null:parseInt(v,10);

function matchCategory(text, kind){
  const hay = strv(text).toLowerCase();

// זיהוי חברות/חיובי אשראי (לצורך זיהוי חיוב מרוכז והשלמות)
const CARD_ISSUERS=['ישראכרט','אמריקן אקספרס','אמריקן','אמקס','לאומי קארד','דיינרס','כאל','מקס','ויזה','כרטיסי אשראי','כרטיס אשראי','כ.אשראי','כ. אשראי'];
function normIssuer(k){ if(k==='אמריקן'||k==='אמקס') return 'אמריקן אקספרס'; if(k==='כרטיס אשראי'||k==='כ.אשראי'||k==='כ. אשראי') return 'כרטיסי אשראי'; return k; }
function detectIssuer(text){ const t=strv(text); for(const k of CARD_ISSUERS){ if(k && t.includes(k)) return normIssuer(k); } return null; }
// «חיוב מרוכז»/שורת-סיכום: בית העסק הוא *עצמו* שם חברת אשראי (כמו «אמריקן אקספרס», «ישראכרט») — לא בית עסק אמיתי.

function isAggMerchant(name){ const n=strv(name).replace(/[\s.,'"״׳\-]/g,''); if(!n) return false; for(const k of CARD_ISSUERS){ const kk=k.replace(/[\s.,'"״׳\-]/g,''); if(kk && (n===kk || (n.startsWith(kk)&&n.length<=kk.length+3))) return true; } return false; }

const MONEY_MOVE_RE=/העבר|העב['׳]|לאחר.?נייד|משיכ|מזומן|כספומט|בנקט|שיק|פייבוקס|paybox|זיכוי|הפקד/i;
function isMoneyMovement(text){ const s=strv(text); return MONEY_MOVE_RE.test(s) || isBitTransfer(s); }
// זיהוי העברת BIT / פייבוקס (לא לבלבל עם "ביטוח": מילת "ביט" חייבת לעמוד בפני עצמה)
const BIT_RE=/(^|[^A-Za-z])BIT([^A-Za-z]|$)|(^|\s)ביט(\s|$)|PAYBOX|פייבוקס|פיי[ ]?בוקס/i;
function isBitTransfer(text){ return BIT_RE.test(strv(text)); }

function reconciliation(){
  const iss={};
  const get=(k)=> (iss[k]=iss[k]||{issuer:k,bank:0,card:0,bankCount:0,cardCount:0});
  db.transactions.forEach(t=>{ if(t.kind!=='expense') return;
    if(t.source==='credit_card'){ const k=detectIssuer(t.account)||detectIssuer(t.merchant)||(strv(t.account)||'כרטיס אשראי'); const g=get(k); g.card+=t.amount; g.cardCount++; }
    else { const k=detectIssuer(t.merchant)||detectIssuer(t.description); if(k){ const g=get(k); g.bank+=t.amount; g.bankCount++; } }
  });
  return Object.values(iss).map(g=>{ g.gap=g.bank-g.card; g.pct=g.bank>0?Math.min(100,Math.round(g.card/g.bank*100)):(g.card>0?100:0);
    g.status = g.bank===0 ? 'card_only' : g.card===0 ? 'pending' : Math.abs(g.gap)<=Math.max(2,g.bank*0.02) ? 'done' : 'partial'; return g; })
    .sort((a,b)=>b.bank-a.bank);
}

async function api(path, opts={}){
  const method=(opts.method||'GET').toUpperCase();
  const b=opts.body||{};
  const [rawPath,query]=path.split('?');
  const qp=Object.fromEntries(new URLSearchParams(query||''));
  const parts=rawPath.split('/').filter(Boolean);
  const res = route(parts, method, b, qp);
  save();
  return res;
}
function route(parts, method, b, qp){
  const [res, id, sub] = parts;
  switch(res){
    case 'categories': return h_categories(method,id,b);
    case 'rules': return h_rules(method,id,b);
    case 'transactions': return h_transactions(method,id,sub,b,qp);
    case 'professionals': return h_professionals(method,id,b);
    case 'warranties': return h_warranties(method,id,b);
    case 'components': return h_components(method,id,sub,b);
    case 'recurring': return h_recurring(method,id,b);
    case 'lighting': return h_lighting(method,id,b);
    case 'documents': return h_documents(method,id,b);
    case 'dashboard': return h_dashboard(qp);
    case 'reconcile': return reconciliation();
    case 'backup': return h_backup(method,b);
  }
  throw new Error('נתיב לא נמצא');
}

  expEss.filter(t=>t.category_id&&!isMortgage(t)).forEach(t=>{const c=catMain(t.category_id); if(!c)return; if(!catMap[c.id])catMap[c.id]={name:c.name,color:c.color,total:0}; catMap[c.id].total+=t.amount;});
  const byCategory=Object.values(catMap).filter(x=>x.total>0).sort((a,c)=>c.total-a.total);
  const perMonth={monthly:1,bimonthly:0.5,quarterly:1/3,yearly:1/12};
  const recurringMonthly=db.recurring.filter(recActive).reduce((s,r)=>s+r.amount*(perMonth[r.frequency]||1),0);
  // מגמת עלות אחזקת הבית (6 חודשים) — תזרים, ללא משכנתא
  const now=new Date(); const trend=[];
  for(let i=5;i>=0;i--){ const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1)); const m=d.toISOString().slice(0,7);
    const e=db.transactions.filter(t=>t.kind==='expense'&&String(t.tx_date).slice(0,7)===m&&countsInTotal(t)&&!isMortgage(t)).reduce((s,t)=>s+t.amount,0);
    const ic=db.transactions.filter(t=>t.kind==='income'&&String(t.tx_date).slice(0,7)===m&&!isRent(t)).reduce((s,t)=>s+t.amount,0);
    trend.push({m,expenses:e,income:ic}); }
  // תחזוקה הבאה — כל הרכיבים לפי מועד קרוב, כולל עתידיים ורכיבים שטרם תוזמנו (בלי חלון של 60 יום שהסתיר פריטים)
  const compsAll=db.components.map(compView);
  const upcomingMaintenance=[...compsAll.filter(c=>c.next_due).sort((a,c)=>a.next_due.localeCompare(c.next_due)), ...compsAll.filter(c=>!c.next_due)].slice(0,6);
  const expiringWarranties=db.warranties.map(warrantyView).filter(w=>w.effective_expiry&&w.days_left<=90).sort((a,c)=>a.effective_expiry.localeCompare(c.effective_expiry)).slice(0,8);
  // שלמות התמונה: מתוך כל ההוצאה שדורשת מהות (פירוט/רגיל + חיובים מרוכזים שממתינים לפירוט),
  // כמה כבר מסווג. חיוב מרוכז ללא פירוט = חוסר, ולכן לא מגיעים ל-100% עד שמעלים פירוט ומסווגים.
  const classifiedTotal=expEss.filter(t=>t.category_id).reduce((s,t)=>s+t.amount,0);
  const essTotal=expEss.reduce((s,t)=>s+t.amount,0);
  const denom=essTotal+pendingCredit;
  const unclassifiedTotal=(essTotal-classifiedTotal)+pendingCredit;
  const completeness = denom>0 ? Math.round(classifiedTotal/denom*100) : 100;
  const pendingIssuers=new Set(pendingLumps.map(t=>detectIssuer(t.merchant)||detectIssuer(t.description))).size;
  return {month:month||'all',homeExpenses,totalExpenses,totalIncome,mortgage,rentalIncome,cashFlowTotal,uncategorized,recurringMonthly,annualProjection:recurringMonthly*12,byCategory,trend,upcomingMaintenance,expiringWarranties,
    pendingCredit,pendingIssuers,completeness,unclassifiedTotal,lumpTotal:pendingCredit};
}

function barsHTML(items,fmt,clickable){ if(!items.length) return '<div class="empty">אין נתונים</div>'; const max=Math.max(...items.map(i=>i.value),1);

  const W=560,H=290,padX=44,padT=20,padB=38; const max=Math.max(...trend.flatMap(t=>[t.expenses,t.income]),1); const n=trend.length; const bw=(W-padX*2)/n;
  const y=v=>H-padB-(v/max)*(H-padB-padT); const x=i=>padX+bw*(i+0.5);

function donut(items,clickable){
  items=items.filter(i=>i.value>0);
  if(!items.length) return '<div class="empty">אין נתונים</div>';
  const total=items.reduce((s,i)=>s+i.value,0);

  const segs=items.map(i=>{ const dash=i.value/total*C; const tip=esc(`${i.label}: ${money(i.value)} · ${Math.round(i.value/total*100)}%`); const s=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="${esc(i.color)}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})" data-tip="${tip}" style="cursor:crosshair"/>`; acc+=dash; return s; }).join('');
  const legend=items.slice(0,10).map(i=>`<div class="bar-row" style="margin-bottom:6px${clickable?';cursor:pointer':''}"${clickable?` data-barlabel="${esc(i.label)}" title="לחצו לפירוט: ${esc(i.label)}"`:` title="${esc(i.label)}"`}><span class="dot" style="background:${esc(i.color)}"></span><div class="bar-label" style="width:auto;flex:1">${esc(i.label)}${clickable?' <span class="muted" style="font-size:11px">🔎</span>':''}</div><div class="bar-value tnum" style="width:auto">${money(i.value)} · ${Math.round(i.value/total*100)}%</div></div>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:170px;height:170px;flex-shrink:0">${segs}<text x="90" y="86" text-anchor="middle" font-size="12" fill="currentColor" opacity=".55">סה״כ</text><text x="90" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${money(total)}</text></svg><div style="flex:1;min-width:180px">${legend}</div></div>`;
}
// גרף רב-קווי (כמה סדרות לאורך חודשים) — RTL: החודש המוקדם מימין
function multiLineChart(months,series){ if(!months.length||!series.length) return '<div class="empty">אין מספיק נתונים</div>';
  const W=580,H=306,padX=46,padT=20,padB=38; const all=series.flatMap(s=>s.values); const max=Math.max(...all,1); const n=months.length; const bw=(W-padX*2)/Math.max(n,1);
  const y=v=>H-padB-(v/max)*(H-padB-padT); const x=i=>padX+bw*(i+0.5);
  const grid=[0,.25,.5,.75,1].map(f=>{ const yy=H-padB-f*(H-padB-padT); return `<line x1="${padX}" y1="${yy}" x2="${W-padX}" y2="${yy}" stroke="currentColor" opacity="${f===0?'.16':'.06'}"/>`+((f===0||f===.5||f===1)?`<text x="${padX-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="currentColor" opacity=".45">${money(Math.round(max*f))}</text>`:''); }).join('');
  const doArea=series.length<=2;
  const defs=doArea?`<defs>${series.map((s,si)=>`<linearGradient id="ar${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".20"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`:'';
  const lines=series.map((s,si)=>{ const pts=months.map((m,i)=>`${x(i)},${y(s.values[i]||0)}`).join(' ');
    const area=doArea?`<polygon points="${x(0)},${H-padB} ${pts} ${x(n-1)},${H-padB}" fill="url(#ar${si})"/>`:'';
    const dots=months.map((m,i)=>`<circle cx="${x(i)}" cy="${y(s.values[i]||0)}" r="3.6" fill="${s.color}" stroke-width="1.8" style="stroke:var(--surface);pointer-events:none"/>`).join('');
    return `${area}<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"/>${dots}`; }).join('');
  // אזורי-ריחוף לכל חודש (עמודה שקופה) — ריחוף בכל מקום בעמודה מציג את כל ערכי אותו חודש
  const cols=months.map((m,i)=>{ const tip=esc(fmtMonth(m)+'\n'+series.map(s=>`${s.name}: ${money(s.values[i]||0)}`).join('\n')); return `<rect x="${x(i)-bw/2}" y="${padT}" width="${bw}" height="${H-padT-padB}" fill="transparent" data-tip="${tip}"/>`; }).join('');
  const labels=months.map((m,i)=>{ const [yy,mm]=m.split('-'); return `<text x="${x(i)}" y="${H-13}" text-anchor="middle" font-size="10.5" font-weight="600" fill="currentColor" opacity=".5">${mm}/${yy.slice(2)}</text>`; }).join('');
  const legend=`<div class="legend">${series.map(s=>`<span><span class="dot" style="background:${s.color}"></span> ${esc(s.name)}</span>`).join('')}</div>`;
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;aspect-ratio:${W}/${H}">${defs}${grid}${lines}${labels}${cols}</svg></div>${legend}`;
}
// עמודות חודשיות עם ערכים חיוביים/שליליים (למאזן נטו) — ירוק/אדום, RTL
function vBarChart(data,fmt){ if(!data.length) return '<div class="empty">אין נתונים</div>'; fmt=fmt||money;
  const W=580,H=290,padX=30,padT=26,padB=40; const n=data.length; const bw=(W-padX*2)/Math.max(n,1);
  const maxAbs=Math.max(...data.map(d=>Math.abs(d.value)),1); const hasNeg=data.some(d=>d.value<0);
  const plotH=H-padT-padB; const zeroY=hasNeg? padT+plotH/2 : H-padB; const scale=hasNeg? (plotH/2)/maxAbs : plotH/maxAbs;
  const barW=bw*0.64; const x=i=>padX+bw*i+bw*0.18;
  const defs=`<defs><linearGradient id="vbP" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f9d58"/></linearGradient><linearGradient id="vbN" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f0883e"/><stop offset="1" stop-color="#e0654a"/></linearGradient></defs>`;
  const bars=data.map((d,i)=>{ const h=Math.max(Math.abs(d.value)*scale,2); const yTop=d.value>=0? zeroY-h : zeroY; const tip=esc(`${d.m?fmtMonth(d.m):(d.label||'')}: ${(d.value>=0?'עודף ':'גירעון ')+fmt(Math.abs(d.value))}`);
    return `<rect x="${x(i)}" y="${yTop}" width="${barW}" height="${h}" rx="5" fill="${d.value>=0?'url(#vbP)':'url(#vbN)'}" data-tip="${tip}"/>`; }).join('');
  const labels=data.map((d,i)=>{ const [yy,mm]=(d.m||'').split('-'); return `<text x="${x(i)+barW/2}" y="${H-13}" text-anchor="middle" font-size="10.5" font-weight="600" fill="currentColor" opacity=".5">${mm}/${(yy||'').slice(2)}</text>`; }).join('');
  const vals=data.map((d,i)=>{ const h=Math.max(Math.abs(d.value)*scale,2); const yTxt=d.value>=0? zeroY-h-6 : zeroY+h+14; return `<text x="${x(i)+barW/2}" y="${yTxt}" text-anchor="middle" font-size="10" font-weight="800" fill="${d.value>=0?'#0f9d58':'#e0654a'}">${(d.value>=0?'+':'−')+fmt(Math.abs(Math.round(d.value/1000)))+'k'}</text>`; }).join('');
  const cols=data.map((d,i)=>{ const tip=esc(`${d.m?fmtMonth(d.m):(d.label||'')}: ${(d.value>=0?'עודף ':'גירעון ')+fmt(Math.abs(d.value))}`); return `<rect x="${padX+bw*i}" y="${padT}" width="${bw}" height="${H-padT-padB}" fill="transparent" data-tip="${tip}"/>`; }).join('');
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;aspect-ratio:${W}/${H}">${defs}<line x1="${padX}" y1="${zeroY}" x2="${W-padX}" y2="${zeroY}" stroke="currentColor" opacity=".18"/>${bars}${vals}${labels}${cols}</svg></div>`;
}

function catSelectOptions(cats,selId){
  // תדירות שימוש לכל קטגוריה — כדי להציג את הנפוצות קודם; קיבוץ תת-קטגוריות תחת הראשית
  const usage={}; db.transactions.forEach(t=>{ if(t.category_id) usage[t.category_id]=(usage[t.category_id]||0)+1; });
  const subUse=(mid)=>cats.filter(c=>c.parent_id==mid).reduce((s,c)=>s+(usage[c.id]||0),0);
  const mainUse=(mc)=>(usage[mc.id]||0)+subUse(mc.id);
  const kindBlock=(kind,label)=>{
    const mains=cats.filter(c=>c.kind===kind&&!c.parent_id).sort((a,b)=>mainUse(b)-mainUse(a)||strv(a.name).localeCompare(strv(b.name),'he'));
    if(!mains.length) return '';
    const inner=mains.map(mc=>{
      const subs=cats.filter(c=>c.parent_id==mc.id).sort((a,b)=>(usage[b.id]||0)-(usage[a.id]||0)||strv(a.name).localeCompare(strv(b.name),'he'));
      return `<option value="${mc.id}" ${mc.id==selId?'selected':''}>${esc(mc.name)}</option>`+
        subs.map(s=>`<option value="${s.id}" ${s.id==selId?'selected':''}>&nbsp;&nbsp;↳ ${esc(s.name)}</option>`).join('');
    }).join('');
    return `<optgroup label="${esc(label)}">${inner}</optgroup>`;
  };
  return `<option value="">🔴 לא מסווג</option>`+kindBlock('expense','הוצאות (הנפוצות ראשונות)')+kindBlock('income','הכנסות');
}

views.import=async()=>{
  const el=document.createElement('div');
  const txs=await api('/transactions');
  // חיוב אשראי מרוכז אמיתי מהבנק = בית העסק הוא חברת אשראי אך החשבון אינו כרטיס אשראי (לא שורת פירוט
  // שבמקרה שם בית העסק שלה מכיל «מקס»/«כאל» וכד׳). כך לא נסמן בטעות עסקאות מפורטות כ"חסרות".
  const isCard=(t)=> isAggLump(t);
  // מה חסר להעלות — 6 חודשים אחרונים
  const nowD=new Date(); const curYM=nowD.getFullYear()+'-'+String(nowD.getMonth()+1).padStart(2,'0');
  const todayISOd=nowD.getFullYear()+'-'+String(nowD.getMonth()+1).padStart(2,'0')+'-'+String(nowD.getDate()).padStart(2,'0');
  const months=[];
  for(let i=0;i<6;i++){ const dd=new Date(Date.UTC(nowD.getUTCFullYear(),nowD.getUTCMonth()-i,1)); months.push(dd.toISOString().slice(0,7)); }
  // תאריך פירוט האשראי האחרון — כדי לזהות חודשים שהפירוט לא מכסה עד סופם
  const lastCardDate=txs.filter(t=>t.kind==='expense'&&isCardDetail(t)).reduce((mx,t)=>String(t.tx_date)>mx?String(t.tx_date):mx,'');
  const monthEnd=ym=>{ const [y,m]=ym.split('-').map(Number); return ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0'); };
  const monthRows=months.map(ym=>{
    const mtx=txs.filter(t=>String(t.tx_date).slice(0,7)===ym);
    const lumps={}; mtx.filter(t=>t.kind==='expense'&&isCard(t)).forEach(t=>{ const k=detectIssuer(t.merchant)||detectIssuer(t.description); if(!lumps[k])lumps[k]={issuer:k,total:0}; lumps[k].total+=t.amount; });
    const covered=(iss)=> mtx.some(t=>t.source==='credit_card' && detectIssuer(t.account)===iss && !isCard(t));
    const needed=Object.values(lumps).filter(p=>!covered(p.issuer)).sort((a,b)=>b.total-a.total);
    const hasDetail=mtx.some(t=>t.kind==='expense'&&isCardDetail(t));
    // כיסוי חלקי: פירוט האשראי לא מגיע עד סוף החודש (החודש הנוכחי, או חודש שהפירוט נעצר בתוכו)
    const cardCovEnd = (lastCardDate && ym>=lastCardDate.slice(0,7)) ? (lastCardDate.slice(0,7)===ym?lastCardDate:'') : monthEnd(ym);
    const isCurrent = ym===curYM;
    const cardPartial = hasDetail && !isCurrent && cardCovEnd && cardCovEnd < monthEnd(ym);
    return {ym, noData:mtx.length===0, needed, isCurrent, cardPartial, cardCovEnd, hasDetail};
  });
  const detIssuer=(new Set(txs.filter(t=>t.kind==='expense'&&isCardDetail(t)).map(t=>detectIssuer(t.account)).filter(Boolean))); const primaryIssuer=[...detIssuer][0]||'כרטיס אשראי';
  const anyIssue=monthRows.some(r=>r.noData||r.needed.length||r.isCurrent||r.cardPartial);
  const upBtn=(iss)=>`<label class="btn-ghost" style="cursor:pointer;padding:4px 10px;font-size:12px">⬆️ ייבוא מסמך<input type="file" hidden accept=".csv,.pdf,text/csv,application/pdf,.xlsx,.xlsm" data-issuer="${esc(iss)}" /></label>`;
  const missingHTML=`<div class="card" style="margin-bottom:18px;border-color:color-mix(in srgb,var(--amber) 35%,var(--border))">
    <div class="card-header"><h2>📋 מה חסר להעלות · חצי שנה אחורה</h2></div>
    <div style="padding:4px 20px 16px">
      <p class="hint" style="margin-bottom:12px">אלו התדפיסים שכדאי להעלות כדי לקבל תמונה מלאה. ליד כל חודש — כפתור העלאה ישיר.</p>
      ${monthRows.map(r=>`<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <strong style="min-width:110px">${fmtMonth(r.ym)}</strong>
        ${r.noData? '<span class="pill status-late">אין נתונים — העלה תדפיס בנק</span>'+upBtn(primaryIssuer)
          : r.needed.length? r.needed.map(p=>`<span style="display:inline-flex;align-items:center;gap:6px"><span class="pill status-soon">${esc(p.issuer)} · ${money(p.total)}</span>${upBtn(p.issuer)}</span>`).join('')
          : r.isCurrent? `<span class="pill status-soon">⏳ החודש עדיין בעיצומו — הנתונים יתמלאו בסופו</span>`
          : r.cardPartial? `<span style="display:inline-flex;align-items:center;gap:6px"><span class="pill status-soon">⏳ פירוט אשראי חלקי — עד ${fmtDate(r.cardCovEnd)} בלבד</span>${upBtn(primaryIssuer)}</span>`

    </div></div>`;
  el.innerHTML=missingHTML+`<div class="card" style="padding:22px">

    <div class="field-row" style="margin-bottom:14px"><div class="field"><label>מקור</label><select id="imp-source"><option value="credit_card">💳 כרטיס אשראי</option><option value="bank">🏦 חשבון בנק</option></select></div><div class="field"><label>שם הכרטיס / החשבון <span class="muted">(מזוהה אוטומטית)</span></label><input id="imp-account" placeholder="לדוגמה: ויזה לאומי / עו״ש הפועלים" /></div></div>

  function readFileRows(file){

      const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';

    <p class="hintbar" style="margin:0 0 12px">כל הוצאה קבועה <strong>משויכת לחיוב אמיתי מתוך ההוצאות</strong> — בחרו את החיוב שירד, וקבעו אם ההוצאה קבועה <strong>לתמיד</strong> או <strong>עד תאריך</strong>.</p>
    ${rows.length?`<div class="table-wrap"><table><thead><tr><th>שם</th><th>מקושר לחיוב</th><th>קטגוריה</th><th>סכום</th><th>תדירות</th><th>לחודש</th><th>תוקף</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr style="${r.eff_active?'':'opacity:.5'}">
      <td><strong>${esc(r.name)}</strong>${r.provider?`<div class="hint">${esc(r.provider)}</div>`:''}${r.due_day?`<div class="hint">חיוב ב‑${r.due_day} לחודש</div>`:''}</td>
      <td>${r.source_merchant?`<span class="pill status-ok">🔗 ${esc(r.source_merchant)}</span>${r.source_date?`<div class="hint tnum">${fmtDate(r.source_date)}</div>`:''}`:'<span class="pill status-late">לא מקושר</span>'}</td>
      <td>${r.category_name?`<span class="badge" style="background:var(--chip)">${esc(r.category_name)}</span>`:'—'}</td>
      <td class="tnum amount-neg">${money2(r.amount)}</td><td>${FREQ[r.frequency]}</td><td class="tnum">${money(r.amount*perMonth[r.frequency])}</td>
      <td>${termLabel(r)}</td>
      <td style="text-align:left"><button class="icon-btn" data-edit="${r.id}">✏️</button><button class="btn-danger" data-del="${r.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין הוצאות קבועות. הוסיפו חשמל, מים, ארנונה, אינטרנט, גנן, בריכה וכו׳ — מתוך חיוב שכבר ירד.</div>'}</div>`;
  const txOptions=(sel)=>`<option value="">— בחרו חיוב מההוצאות —</option>`+expTx.map(t=>{ const mc=t.merchant||t.description||'—'; return `<option value="${t.id}" data-merchant="${esc(mc)}" data-amount="${t.amount}" data-cat="${t.category_id||''}" data-date="${esc(t.tx_date||'')}" data-day="${t.tx_date?(+String(t.tx_date).slice(8,10)||''):''}" ${sel==t.id?'selected':''}>${fmtDate(t.tx_date)} · ${esc(mc)} · ${money2(t.amount)}</option>`; }).join('');
  const form=(r={})=>`
    <div class="field"><label>שייכו לחיוב מתוך ההוצאות *</label><select name="source_tx_id" id="rec-src">${txOptions(r.source_tx_id)}</select>
      <input type="hidden" name="match_text" id="rec-match" value="${esc(r.match_text||'')}" /><div class="hint">בחרו את החיוב שירד בפועל — הפרטים ימולאו אוטומטית וניתן לערוך.</div></div>
    <div class="field"><label>שם *</label><input name="name" id="rec-name" value="${esc(r.name||'')}" placeholder="חשמל / ארנונה / גנן…" required /></div>
    <div class="field-row"><div class="field"><label>ספק</label><input name="provider" id="rec-prov" value="${esc(r.provider||'')}" /></div><div class="field"><label>סכום (₪)</label><input name="amount" id="rec-amount" type="number" step="0.01" min="0" value="${r.amount??''}" /></div></div>
    <div class="field-row"><div class="field"><label>תדירות</label><select name="frequency">${Object.entries(FREQ).map(([k,v])=>`<option value="${k}" ${r.frequency===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>יום חיוב בחודש</label><input name="due_day" id="rec-day" type="number" min="1" max="31" value="${r.due_day??''}" /></div></div>
    <div class="field-row"><div class="field"><label>קטגוריה</label><select name="category_id" id="rec-cat">${categoryOptions(cats,r.category_id,'expense')}</select></div><div class="field"><label>בעל מקצוע קשור</label><select name="professional_id">${professionalOptions(pros,r.professional_id)}</select></div></div>
    <div class="field-row"><div class="field"><label>בתוקף מ‑</label><input name="start_date" id="rec-start" type="date" value="${esc(r.start_date||'')}" /></div><div class="field"><label>משך</label><select name="term" id="rec-term"><option value="forever" ${r.term!=='until'?'selected':''}>לתמיד</option><option value="until" ${r.term==='until'?'selected':''}>עד תאריך</option></select></div></div>
    <div class="field" id="rec-endwrap" style="${r.term==='until'?'':'display:none'}"><label>בתוקף עד</label><input name="end_date" id="rec-end" type="date" value="${esc(r.end_date||'')}" /></div>
    <div class="field"><label><input type="checkbox" name="active" ${r.active===0?'':'checked'} /> פעיל</label></div><div class="field"><label>הערות</label><input name="notes" value="${esc(r.notes||'')}" /></div>`;
  const wire=()=>{ const q=(s)=>document.querySelector('.modal '+s);
    const src=q('#rec-src');
    if(src) src.onchange=()=>{ const o=src.selectedOptions[0]; if(!o||!o.value) return; const d=o.dataset;
      const set=(sel,v,onlyIfEmpty)=>{ const e=q(sel); if(e&&(!onlyIfEmpty||!e.value)) e.value=v; };
      q('#rec-match')&&(q('#rec-match').value=d.merchant||'');
      set('#rec-name',d.merchant||'',true); set('#rec-prov',d.merchant||'',true);
      set('#rec-amount',d.amount||''); set('#rec-day',d.day||'',true); set('#rec-start',d.date||'',true);
      if(d.cat){ const c=q('#rec-cat'); if(c&&!c.value) c.value=d.cat; } };
    const term=q('#rec-term'); if(term) term.onchange=()=>{ const w=q('#rec-endwrap'); if(w) w.style.display=term.value==='until'?'':'none'; };
  };
  el.querySelector('#add').onclick=()=>{ openModal('הוצאה קבועה',form(),async fd=>{await api('/recurring',{method:'POST',body:{...fd,active:fd.active==='on'}});toast('נוסף');render();}); setTimeout(wire,0); };
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);openModal('עריכת הוצאה קבועה',form(r),async fd=>{await api('/recurring/'+r.id,{method:'PUT',body:{...fd,active:fd.active==='on'}});toast('עודכן');render();}); setTimeout(wire,0);});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק?',async()=>{await api('/recurring/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));
  return el;
};

views.maintenance=async()=>{
  const [rows,pros]=await Promise.all([api('/components'),api('/professionals')]);
  const late=rows.filter(r=>r.days_left!==null&&r.days_left<0).length;
  const soon=rows.filter(r=>r.days_left!==null&&r.days_left>=0&&r.days_left<=30).length;
  const el=document.createElement('div');
  el.innerHTML=`<div class="stats-grid"><div class="stat-card ${late?'expense':'accent'}"><div class="label">⏰ באיחור</div><div class="value tnum">${late}</div></div><div class="stat-card ${soon?'warn':'accent'}"><div class="label">🔜 בחודש הקרוב</div><div class="value tnum">${soon}</div></div><div class="stat-card accent"><div class="label">🧩 סה״כ רכיבים</div><div class="value tnum">${rows.length}</div></div></div>
    <div class="card"><div class="card-header"><h2>רכיבי בית ותחזוקה תקופתית</h2><button class="btn" id="add">+ רכיב חדש</button></div>
    ${rows.length?`<div class="table-wrap"><table><thead><tr><th>רכיב</th><th>מערכת</th><th>מיקום</th><th>הוחלף</th><th>תדירות</th><th>הבא</th><th>בעל מקצוע</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>
      <td><strong>${esc(r.name)}</strong></td><td><span class="muted">${esc(r.system)}</span></td><td>${esc(r.area)||'—'}</td><td class="tnum">${r.last_replaced?fmtDate(r.last_replaced):'<span class="muted">—</span>'}</td><td>${r.interval_months} ח׳</td>
      <td>${r.next_due?statusPill(r.days_left):'<span class="pill status-none">—</span>'}</td><td>${r.professional_name?`${esc(r.professional_name)}${r.professional_phone?` <a class="link" href="tel:${esc(r.professional_phone)}">📞</a>`:''}`:'—'}</td>
      <td style="text-align:left"><button class="icon-btn" data-done="${r.id}" title="סמן שטופל">✅</button><button class="icon-btn" data-log="${r.id}" title="היסטוריה">📖</button><button class="icon-btn" data-edit="${r.id}">✏️</button><button class="btn-danger" data-del="${r.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין רכיבים. הוסיפו מסנני מים, מזגנים, משאבת בריכה, ראשי המטרה, גלאי עשן וכו׳.</div>'}</div>${datalist('areas',AREAS)}${datalist('systems',SYSTEMS)}`;
  const form=(r={})=>`<div class="field"><label>שם הרכיב *</label><input name="name" value="${esc(r.name||'')}" placeholder="מסנן מים למטבח / פילטר בריכה…" required /></div>
    <div class="field-row"><div class="field"><label>מערכת</label><input name="system" list="systems" value="${esc(r.system||'כללי')}" /></div><div class="field"><label>מיקום</label><input name="area" list="areas" value="${esc(r.area||'')}" /></div></div>
    <div class="field-row-3"><div class="field"><label>הוחלף לאחרונה</label><input name="last_replaced" type="date" value="${esc(r.last_replaced||'')}" /></div><div class="field"><label>כל כמה חודשים</label><input name="interval_months" type="number" min="1" value="${r.interval_months??12}" /></div><div class="field"><label>עלות (₪)</label><input name="cost_estimate" type="number" step="0.01" min="0" value="${r.cost_estimate??''}" /></div></div>
    <div class="field"><label>בעל מקצוע</label><select name="professional_id">${professionalOptions(pros,r.professional_id)}</select></div><div class="field"><label>הערות</label><input name="notes" value="${esc(r.notes||'')}" /></div>`;
  el.querySelector('#add').onclick=()=>openModal('רכיב חדש',form(),async fd=>{await api('/components',{method:'POST',body:fd});toast('נוסף');render();},{wide:true});
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);openModal('עריכת רכיב',form(r),async fd=>{await api('/components/'+r.id,{method:'PUT',body:fd});toast('עודכן');render();},{wide:true});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק רכיב זה וכל ההיסטוריה שלו?',async()=>{await api('/components/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));
  el.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.done);
    const f=`<p class="hint">רישום החלפה/טיפול יעדכן את תאריך ההחלפה האחרון ואת המועד הבא.</p>
      <div class="field-row"><div class="field"><label>תאריך</label><input name="service_date" type="date" value="${todayISO()}" /></div><div class="field"><label>עלות (₪)</label><input name="cost" type="number" step="0.01" min="0" value="${r.cost_estimate||''}" /></div></div>
      <div class="field"><label>תיאור</label><input name="description" value="החלפה" /></div><div class="field"><label>בעל מקצוע</label><select name="professional_id">${professionalOptions(pros,r.professional_id)}</select></div>`;
    openModal(`טיפול: ${esc(r.name)}`,f,async fd=>{await api('/components/'+r.id+'/service',{method:'POST',body:fd});toast('נרשם טיפול');render();},{submitLabel:'רישום טיפול'});});
  el.querySelectorAll('[data-log]').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>x.id==b.dataset.log); const log=await api('/components/'+r.id+'/log');
    const body=log.length?`<div class="table-wrap"><table style="width:100%"><thead><tr><th>תאריך</th><th>תיאור</th><th>עלות</th><th>מי</th></tr></thead><tbody>${log.map(l=>`<tr><td class="tnum">${fmtDate(l.service_date)}</td><td>${esc(l.description)}</td><td class="tnum">${money2(l.cost)}</td><td>${esc(l.professional_name||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין היסטוריית טיפולים עדיין.</div>';
    openModal(`היסטוריה: ${esc(r.name)}`,body,async()=>{},{wide:true,submitLabel:'סגירה'});});
  return el;
};

views.warranties=async()=>{
  const [rows,pros]=await Promise.all([api('/warranties'),api('/professionals')]);
  const active=rows.filter(r=>r.days_left===null||r.days_left>=0).length;
  const el=document.createElement('div');
  const thumb=(r)=> r.image?`<img src="${esc(r.image)}" class="pro-avatar" data-img="${r.id}" alt="${esc(r.item_name)}" style="cursor:zoom-in" />`:'<span class="pro-avatar ph">📦</span>';
  const docLink=(r)=> r.doc_url?`<a class="icon-btn" href="${esc(r.doc_url)}" target="_blank" rel="noopener" download="${esc((r.item_name||'תעודה')+'')}" title="סריקת התעודה">📎</a>`:'';
  el.innerHTML=`<div class="stats-grid"><div class="stat-card accent"><div class="label">📜 תעודות</div><div class="value tnum">${rows.length}</div></div><div class="stat-card income"><div class="label">✅ בתוקף</div><div class="value tnum">${active}</div></div><div class="stat-card expense"><div class="label">⌛ פגו</div><div class="value tnum">${rows.length-active}</div></div></div>
    <div class="card"><div class="card-header"><h2>תעודות אחריות</h2><button class="btn" id="add">+ תעודה חדשה</button></div>
    ${rows.length?`<div class="table-wrap"><table><thead><tr><th>תמונה</th><th>פריט</th><th>יצרן/דגם</th><th>מיקום</th><th>נרכש</th><th>תוקף עד</th><th>סטטוס</th><th>תעודה</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>
      <td>${thumb(r)}</td>
      <td><strong>${esc(r.item_name)}</strong>${r.serial?`<div class="hint">מק״ט: ${esc(r.serial)}</div>`:''}</td><td>${esc([r.brand,r.model].filter(Boolean).join(' '))||'—'}</td><td>${esc(r.area)||'—'}</td><td class="tnum">${r.purchase_date?fmtDate(r.purchase_date):'—'}</td><td class="tnum">${r.effective_expiry?fmtDate(r.effective_expiry):'—'}</td><td>${statusPill(r.days_left,{soon:90})}</td>
      <td style="text-align:center">${docLink(r)||'<span class="muted">—</span>'}</td>
      <td style="text-align:left"><button class="icon-btn" data-edit="${r.id}">✏️</button><button class="btn-danger" data-del="${r.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין תעודות. הוסיפו מקרר, תנור, מזגנים, דוד שמש, מכונת כביסה, טלוויזיה וכו׳.</div>'}</div>${datalist('areas',AREAS)}`;

  function openWarrantyModal(title,r,onSave){
    let img=r.image||''; let doc=r.doc_url||'';
    const form=`
      <div class="field-row">
        <div class="field"><label>תמונת המוצר</label><div class="img-uploader"><div class="img-prev" id="w-prev">${img?`<img src="${esc(img)}" alt="" />`:'<span>אין תמונה</span>'}</div>
          <div><input type="file" id="w-imgfile" accept="image/*" class="img-file" /><div class="hint">צלמו/בחרו תמונה של המוצר. נשמרת ומוקטנת אוטומטית.</div>${img?'<button type="button" class="btn-ghost" id="w-imgclear" style="margin-top:8px;padding:5px 12px">הסר תמונה</button>':''}</div></div></div>
        <div class="field"><label>סריקת תעודת האחריות</label>
          <div id="w-docprev" class="docs-list"></div>
          <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><label class="btn-ghost" style="cursor:pointer;padding:6px 12px">⬆️ העלה סריקה<input type="file" id="w-docfile" accept="image/*,application/pdf" hidden /></label><button type="button" class="btn-ghost" id="w-doclink" style="padding:6px 12px">🔗 קישור</button></div>
          <div class="hint">תמונה או PDF של התעודה. קובץ נשמר בדפדפן (עד ~3MB); לקובץ גדול הוסיפו קישור.</div></div>
      </div>
      <div class="field-row"><div class="field"><label>שם הפריט *</label><input name="item_name" value="${esc(r.item_name||'')}" required /></div><div class="field"><label>סוג/קטגוריה</label><input name="category" value="${esc(r.category||'')}" placeholder="מקרר, מזגן…" /></div></div>
      <div class="field-row-3"><div class="field"><label>יצרן</label><input name="brand" value="${esc(r.brand||'')}" /></div><div class="field"><label>דגם</label><input name="model" value="${esc(r.model||'')}" /></div><div class="field"><label>מק״ט/סריאלי</label><input name="serial" value="${esc(r.serial||'')}" /></div></div>
      <div class="field-row-3"><div class="field"><label>מיקום</label><input name="area" list="areas" value="${esc(r.area||'')}" /></div><div class="field"><label>נקנה מ‑</label><input name="vendor" value="${esc(r.vendor||'')}" /></div><div class="field"><label>עלות (₪)</label><input name="cost" type="number" step="0.01" min="0" value="${r.cost??''}" /></div></div>
      <div class="field-row-3"><div class="field"><label>תאריך רכישה</label><input name="purchase_date" type="date" value="${esc(r.purchase_date||'')}" /></div><div class="field"><label>אחריות (חודשים)</label><input name="warranty_months" type="number" min="0" value="${r.warranty_months??12}" /></div><div class="field"><label>או תוקף עד (ידני)</label><input name="expiry_date" type="date" value="${esc(r.expiry_date||'')}" /></div></div>
      <div class="field-row"><div class="field"><label>בעל מקצוע / שירות</label><select name="professional_id">${professionalOptions(pros,r.professional_id)}</select></div><div class="field"><label>הערות</label><input name="notes" value="${esc(r.notes||'')}" /></div></div>`;
    openModal(title,form,async fd=>{ await onSave({...fd,image:img,doc_url:doc}); },{wide:true});
    setTimeout(()=>{
      const q=(s)=>document.querySelector('.modal '+s);
      // תמונת מוצר
      const pf=q('#w-imgfile'), prev=q('#w-prev');
      const setClear=()=>{ let clr=q('#w-imgclear'); if(img&&!clr){ clr=document.createElement('button'); clr.type='button'; clr.className='btn-ghost'; clr.id='w-imgclear'; clr.style.cssText='margin-top:8px;padding:5px 12px'; clr.textContent='הסר תמונה'; pf.parentElement.appendChild(clr); }
        q('#w-imgclear') && (q('#w-imgclear').onclick=()=>{ img=''; prev.innerHTML='<span>אין תמונה</span>'; q('#w-imgclear').remove(); }); };
      if(pf) pf.onchange=()=>{ const f=pf.files[0]; if(!f) return; resizeImage(f,420,(u)=>{ img=u; prev.innerHTML=`<img src="${u}" alt="" />`; setClear(); }); };
      setClear();
      // סריקת תעודה
      const renderDoc=()=>{ const c=q('#w-docprev'); if(!c) return; c.innerHTML=doc?`<div class="doc-item"><a class="link" href="${esc(doc)}" target="_blank" rel="noopener">📄 סריקת התעודה</a><button type="button" class="btn-danger" id="w-docdel">🗑</button></div>`:'<span class="hint">לא צורפה סריקה.</span>';
        const del=q('#w-docdel'); if(del) del.onclick=()=>{ doc=''; renderDoc(); }; };
      renderDoc();
      const df=q('#w-docfile'); if(df) df.onchange=()=>{ const f=df.files[0]; if(!f) return; if(f.size>3*1024*1024){ toast('הקובץ גדול מדי (מעל 3MB) — הוסיפו קישור במקום',true); df.value=''; return; }
        const rd=new FileReader(); rd.onload=()=>{ doc=rd.result; renderDoc(); }; rd.readAsDataURL(f); df.value=''; };
      const dl=q('#w-doclink'); if(dl) dl.onclick=()=>{ const url=prompt('הדביקו קישור לסריקת התעודה (https://…)',doc||''); if(url!==null){ doc=url.trim(); renderDoc(); } };
    },0);
  }

  el.querySelector('#add').onclick=()=>openWarrantyModal('תעודת אחריות',{},async body=>{await api('/warranties',{method:'POST',body});toast('נוסף');render();});
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);openWarrantyModal('עריכת תעודה',r,async body=>{await api('/warranties/'+r.id,{method:'PUT',body});toast('עודכן');render();});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק תעודה זו?',async()=>{await api('/warranties/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));

const docState={cat:'',house:''};
views.documents=async()=>{
  const rows=await api('/documents');
  const el=document.createElement('div');
  const isImg=(d)=> /^data:image\//.test(d.url||'') || /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(d.url||'');
  const isPdf=(d)=> /^data:application\/pdf/.test(d.url||'') || /\.pdf(\?|#|$)/i.test(d.url||'');
  const icon=(d)=> isImg(d)?'🖼️':isPdf(d)?'📕':'📄';
  // ספירה לפי תחום עניין ולפי בית
  const counts={}; rows.forEach(d=>{ const k=d.category||'ללא סיווג'; counts[k]=(counts[k]||0)+1; });
  const cats=Object.keys(counts).sort((a,c)=>c.localeCompare(a)==0?0:counts[c]-counts[a]);
  const hCounts={}; rows.forEach(d=>{ const k=d.house||'ללא בית'; hCounts[k]=(hCounts[k]||0)+1; });
  const houseKeys=[...HOUSES.filter(h=>hCounts[h]), ...Object.keys(hCounts).filter(h=>!HOUSES.includes(h))];
  const filtered = rows.filter(d=> (!docState.cat||(d.category||'ללא סיווג')===docState.cat) && (!docState.house||(d.house||'ללא בית')===docState.house) );
  const chip=(label,val,n)=>`<button class="chip ${docState.cat===val?'active':''}" data-cat="${esc(val)}">${esc(label)} <span class="chip-n">${n}</span></button>`;
  const hchip=(label,val,n)=>`<button class="chip ${docState.house===val?'active':''}" data-house="${esc(val)}">${esc(label)} <span class="chip-n">${n}</span></button>`;
  el.innerHTML=`
    <div class="card-header" style="border:none;padding:0 0 12px"><h2 style="margin:0">📁 ארכיון מסמכי הבית</h2><button class="btn" id="add">+ מסמך חדש</button></div>
    <p class="hintbar">כל המסמכים החשובים של הבית במקום אחד — חוזים, ביטוחים, קבלות, תוכניות ועוד. סווגו כל מסמך <strong>לפי תחום עניין</strong> ו<strong>לפי בית</strong> (מכבים / רמלה / כפר אוריה) כדי למצוא אותו בקלות. הקבצים נשמרים בדפדפן ומסתנכרנים אוטומטית בין המכשירים.</p>
    <div class="row" style="margin:0 0 4px;font-weight:600;color:var(--muted)">🏠 בית</div>
    <div class="chips" style="margin-bottom:12px">${hchip('הכול','',rows.length)}${houseKeys.map(h=>hchip(h,h,hCounts[h])).join('')}</div>
    <div class="row" style="margin:0 0 4px;font-weight:600;color:var(--muted)">🗂️ תחום עניין</div>
    <div class="chips" style="margin-bottom:14px">${chip('הכול',''+'',rows.length)}${cats.map(c=>chip(c,c,counts[c])).join('')}</div>
    ${filtered.length?`<div class="grid-cards">${filtered.map(d=>`<div class="mini-card">
      <div style="display:flex;gap:10px;align-items:flex-start">
        ${isImg(d)?`<img src="${esc(d.url)}" class="doc-thumb" data-img="${d.id}" alt="" style="width:54px;height:54px;object-fit:cover;border-radius:10px;cursor:zoom-in" />`:`<span class="doc-thumb ph" style="width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:10px;background:var(--surface-2,rgba(127,127,127,.12))">${icon(d)}</span>`}
        <div style="flex:1;min-width:0"><h4 style="margin:0 0 2px;word-break:break-word">${esc(d.name)}</h4>
          <div class="row" style="margin:0;flex-wrap:wrap;gap:4px">${d.house?`<span class="pill status-soon">🏠 ${esc(d.house)}</span>`:''}${d.category?`<span class="pill status-ok">${esc(d.category)}</span>`:'<span class="pill status-none">ללא סיווג</span>'}</div>
          ${d.doc_date?`<div class="row" style="margin:4px 0 0">📅 ${fmtDate(d.doc_date)}</div>`:''}
          ${d.notes?`<div class="row" style="margin:4px 0 0">${esc(d.notes)}</div>`:''}
        </div></div>
      <div class="contact-actions" style="margin-top:10px"><a class="btn-ghost" href="${esc(d.url)}" target="_blank" rel="noopener" download="${esc(d.name||'מסמך')}">פתח / הורד</a><span class="spacer"></span><button class="icon-btn" data-edit="${d.id}">✏️</button><button class="btn-danger" data-del="${d.id}">🗑</button></div>
      </div>`).join('')}</div>`:'<div class="card"><div class="empty">אין מסמכים עדיין. העלו חוזה שכירות, פוליסת ביטוח, אישור משכנתא, תוכניות הבית, קבלות וכו׳ — וסווגו לפי תחום עניין.</div></div>'}
    ${datalist('doc-cats',DOC_CATEGORIES)}`;

  function openDocModal(title,r,onSave){
    let url=r.url||''; let fileName=r.name||'';
    const form=`
      <div class="field"><label>קובץ המסמך</label>
        <div id="d-prev" class="docs-list"></div>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><label class="btn-ghost" style="cursor:pointer;padding:6px 12px">⬆️ העלה קובץ<input type="file" id="d-file" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt" hidden /></label><button type="button" class="btn-ghost" id="d-link" style="padding:6px 12px">🔗 קישור</button></div>
        <div class="hint">תמונה / PDF / קובץ. נשמר בדפדפן (עד ~3MB); לקובץ גדול הוסיפו קישור (Drive/Dropbox).</div></div>
      <div class="field-row"><div class="field"><label>שם המסמך *</label><input name="name" id="d-name" value="${esc(r.name||'')}" required placeholder="חוזה שכירות 2026…" /></div><div class="field"><label>בית 🏠</label><input name="house" list="doc-houses" value="${esc(r.house||'')}" placeholder="מכבים / רמלה / כפר אוריה…" /></div></div>
      <div class="field-row"><div class="field"><label>תחום עניין</label><input name="category" list="doc-cats" value="${esc(r.category||'')}" placeholder="בחרו או הקלידו…" /></div><div class="field"><label>תאריך המסמך</label><input name="doc_date" type="date" value="${esc(r.doc_date||'')}" /></div></div>
      <div class="field"><label>הערות</label><input name="notes" value="${esc(r.notes||'')}" /></div>${datalist('doc-houses',HOUSES)}`;
    openModal(title,form,async fd=>{ if(!url) throw new Error('יש להעלות קובץ או להזין קישור'); await onSave({...fd,url}); },{wide:true});
    setTimeout(()=>{
      const q=(s)=>document.querySelector('.modal '+s);
      const renderPrev=()=>{ const c=q('#d-prev'); if(!c) return; c.innerHTML=url?`<div class="doc-item"><a class="link" href="${esc(url)}" target="_blank" rel="noopener">📄 ${esc(fileName||'המסמך')}</a><button type="button" class="btn-danger" id="d-del">🗑</button></div>`:'<span class="hint">לא צורף קובץ.</span>';
        const del=q('#d-del'); if(del) del.onclick=()=>{ url=''; renderPrev(); }; };
      renderPrev();
      const f=q('#d-file'); if(f) f.onchange=()=>{ const file=f.files[0]; if(!file) return; if(file.size>3*1024*1024){ toast('הקובץ גדול מדי (מעל 3MB) — הוסיפו קישור במקום',true); f.value=''; return; }
        const rd=new FileReader(); rd.onload=()=>{ url=rd.result; fileName=file.name; const nm=q('#d-name'); if(nm&&!nm.value) nm.value=file.name.replace(/\.[^.]+$/,''); renderPrev(); }; rd.readAsDataURL(file); f.value=''; };
      const dl=q('#d-link'); if(dl) dl.onclick=()=>{ const v=prompt('הדביקו קישור למסמך (https://…)',url||''); if(v!==null){ url=v.trim(); fileName=fileName||'קישור'; renderPrev(); } };
    },0);
  }

  el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ docState.cat=b.dataset.cat; render(); });
  el.querySelectorAll('[data-house]').forEach(b=>b.onclick=()=>{ docState.house=b.dataset.house; render(); });
  el.querySelector('#add').onclick=()=>openDocModal('מסמך חדש',{category:docState.cat||'',house:docState.house||''},async body=>{await api('/documents',{method:'POST',body});toast('נוסף');render();});
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);openDocModal('עריכת מסמך',r,async body=>{await api('/documents/'+r.id,{method:'PUT',body});toast('עודכן');render();});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק מסמך זה?',async()=>{await api('/documents/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));
  el.querySelectorAll('[data-img]').forEach(im=>im.onclick=()=>lightbox(im.src));
  return el;
};

views.professionals=async()=>{

  const docsLine=(r)=> (r.documents&&r.documents.length)?`<div class="row">📎 ${r.documents.map(d=>`<a class="link" href="${esc(d.url)}" target="_blank" rel="noopener" download="${esc(d.name||'מסמך')}">${esc(d.name||'מסמך')}</a>`).join(' · ')}</div>`:'';
  el.innerHTML=`<div class="card-header" style="border:none;padding:0 0 16px"><h2 style="margin:0">בעלי מקצוע</h2><button class="btn" id="add">+ בעל מקצוע</button></div>
    ${rows.length?`<div class="grid-cards">${rows.map(r=>`<div class="mini-card">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">${avatar(r)}<div><h4 style="margin:0">${esc(r.name)} ${r.rating?stars(r.rating):''}</h4><div class="row" style="margin:2px 0">🔧 ${esc(r.trade)||'—'}${r.company?' · '+esc(r.company):''}</div></div></div>
      ${r.specialty?`<div class="row">🎯 ${esc(r.specialty)}</div>`:''}${r.phone?`<div class="row">📞 ${esc(r.phone)}</div>`:''}${r.email?`<div class="row">✉️ ${esc(r.email)}</div>`:''}

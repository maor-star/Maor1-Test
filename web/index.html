      <div class="contact-actions">${r.phone?`<a class="btn-ghost" href="tel:${esc(r.phone)}">חיוג</a><a class="btn-ghost" href="https://wa.me/972${esc(r.phone.replace(/\D/g,'').replace(/^0/,''))}" target="_blank" rel="noopener">וואטסאפ</a>`:''}<span class="spacer"></span><button class="icon-btn" data-edit="${r.id}">✏️</button><button class="btn-danger" data-del="${r.id}">🗑</button></div></div>`).join('')}</div>`:'<div class="card"><div class="empty">אין בעלי מקצוע. הוסיפו חשמלאי, אינסטלטור, גנן, טכנאי בריכה וכו׳.</div></div>'}${datalist('trades',TRADES)}`;

    const form=`
      <div class="field"><label>תמונה</label><div class="img-uploader"><div class="img-prev" id="p-prev">${img?`<img src="${esc(img)}" alt="" />`:'<span>אין תמונה</span>'}</div>
        <div><input type="file" id="p-file" accept="image/*" class="img-file" /><div class="hint">תמונת פרופיל של בעל המקצוע.</div>${img?'<button type="button" class="btn-ghost" id="p-clear" style="margin-top:8px;padding:5px 12px">הסר תמונה</button>':''}</div></div></div>
      <div class="field-row"><div class="field"><label>שם *</label><input name="name" value="${esc(r.name||'')}" required /></div><div class="field"><label>תחום</label><input name="trade" list="trades" value="${esc(r.trade||'')}" /></div></div>
      <div class="field"><label>תחום התמחות</label><input name="specialty" value="${esc(r.specialty||'')}" placeholder="לדוגמה: מזגנים מרכזיים, דוד שמש, תיקוני חירום…" /></div>
      <div class="field-row"><div class="field"><label>חברה</label><input name="company" value="${esc(r.company||'')}" /></div><div class="field"><label>טלפון</label><input name="phone" value="${esc(r.phone||'')}" /></div></div>
      <div class="field-row"><div class="field"><label>אימייל</label><input name="email" type="email" value="${esc(r.email||'')}" /></div><div class="field"><label>דירוג (0‑5)</label><input name="rating" type="number" min="0" max="5" value="${r.rating??0}" /></div></div>
      <div class="field"><label>מסמכים נוספים (רישיון, ביטוח, הצעת מחיר…)</label>
        <div id="p-docs" class="docs-list"></div>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><label class="btn-ghost" style="cursor:pointer;padding:6px 12px">⬆️ העלה קובץ<input type="file" id="p-docfile" accept="image/*,application/pdf" hidden /></label><button type="button" class="btn-ghost" id="p-doclink" style="padding:6px 12px">🔗 הוסף קישור</button></div>
        <div class="hint">קבצים נשמרים בדפדפן. לקובץ גדול (מעל ~3MB) עדיף להוסיף קישור.</div></div>
      <div class="field"><label>הערות</label><input name="notes" value="${esc(r.notes||'')}" /></div>`;
    openModal(title,form,async fd=>{ await onSave({...fd,image:img,documents:docs}); },{wide:true});
    setTimeout(()=>{
      const q=(s)=>document.querySelector('.modal '+s);
      const renderDocs=()=>{ const c=q('#p-docs'); if(!c) return; c.innerHTML=docs.length?docs.map((d,i)=>`<div class="doc-item"><a class="link" href="${esc(d.url)}" target="_blank" rel="noopener">📄 ${esc(d.name||'מסמך')}</a><button type="button" class="btn-danger" data-doc="${i}">🗑</button></div>`).join(''):'<span class="hint">אין מסמכים עדיין.</span>';
        c.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>{ docs.splice(+b.dataset.doc,1); renderDocs(); }); };
      renderDocs();
      const pf=q('#p-file'), prev=q('#p-prev');
      const setClear=()=>{ let clr=q('#p-clear'); if(img&&!clr){ clr=document.createElement('button'); clr.type='button'; clr.className='btn-ghost'; clr.id='p-clear'; clr.style.cssText='margin-top:8px;padding:5px 12px'; clr.textContent='הסר תמונה'; pf.parentElement.appendChild(clr); }
        q('#p-clear') && (q('#p-clear').onclick=()=>{ img=''; prev.innerHTML='<span>אין תמונה</span>'; q('#p-clear').remove(); }); };
      if(pf) pf.onchange=()=>{ const f=pf.files[0]; if(!f) return; resizeImage(f,320,(u)=>{ img=u; prev.innerHTML=`<img src="${u}" alt="" />`; setClear(); }); };
      setClear();
      const df=q('#p-docfile'); if(df) df.onchange=()=>{ const f=df.files[0]; if(!f) return; if(f.size>3*1024*1024){ toast('הקובץ גדול מדי (מעל 3MB) — הוסיפו קישור במקום',true); df.value=''; return; }
        const rd=new FileReader(); rd.onload=()=>{ docs.push({name:f.name,url:rd.result}); renderDocs(); }; rd.readAsDataURL(f); df.value=''; };
      const dl=q('#p-doclink'); if(dl) dl.onclick=()=>{ const url=prompt('הדביקו קישור למסמך (https://…)'); if(!url) return; const name=prompt('שם המסמך:')||url; docs.push({name,url}); renderDocs(); };
    },0);
  }

  el.querySelector('#add').onclick=()=>openProModal('בעל מקצוע',{},async body=>{await api('/professionals',{method:'POST',body});toast('נוסף');render();});
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);openProModal('עריכת בעל מקצוע',r,async body=>{await api('/professionals/'+r.id,{method:'PUT',body});toast('עודכן');render();});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק בעל מקצוע זה?',async()=>{await api('/professionals/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));
  return el;
};

      <div><input type="file" id="img-file" accept="image/*" class="img-file" /><div class="hint">צלמו או בחרו תמונה של הנורה/האריזה. נשמרת בדפדפן ומוקטנת אוטומטית.</div>
      ${r.image?'<button type="button" class="btn-ghost" id="img-clear" style="margin-top:8px;padding:5px 12px">הסר תמונה</button>':''}</div></div></div>
    <div class="field-row"><div class="field"><label>הוחלף לאחרונה</label><input name="last_replaced" type="date" value="${esc(r.last_replaced||'')}" /></div><div class="field"><label>הערות</label><input name="notes" value="${esc(r.notes||'')}" /></div></div>`;
  const wireImage=()=>{ const file=document.getElementById('img-file'); const prev=document.getElementById('img-prev'); const hidden=document.querySelector('.modal input[name="image"]'); const clr=document.getElementById('img-clear');
    if(file) file.onchange=()=>{ const f=file.files[0]; if(!f) return; resizeImage(f,420,(dataUrl)=>{ hidden.value=dataUrl; prev.innerHTML=`<img src="${dataUrl}" alt="תצוגה" />`; if(!document.getElementById('img-clear')){ const b=document.createElement('button'); b.type='button'; b.className='btn-ghost'; b.id='img-clear'; b.style.cssText='margin-top:8px;padding:5px 12px'; b.textContent='הסר תמונה'; b.onclick=clearImg; file.parentElement.appendChild(b);} }); };
    if(clr) clr.onclick=clearImg;
    function clearImg(){ const hidden=document.querySelector('.modal input[name="image"]'); hidden.value=''; document.getElementById('img-prev').innerHTML='<span>אין תמונה</span>'; document.getElementById('img-clear')?.remove(); } };
  el.querySelector('#add').onclick=()=>{ openModal('נורה / מנורה',form(),async fd=>{await api('/lighting',{method:'POST',body:fd});toast('נוסף');render();},{wide:true}); setTimeout(wireImage,0); };
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);openModal('עריכת נורה',form(r),async fd=>{await api('/lighting/'+r.id,{method:'PUT',body:fd});toast('עודכן');render();},{wide:true}); setTimeout(wireImage,0);});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק?',async()=>{await api('/lighting/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));
  el.querySelectorAll('[data-img]').forEach(img=>img.onclick=()=>lightbox(img.src));
  return el;
};
// הקטנת תמונה לפני שמירה ב-localStorage
function resizeImage(file,maxDim,cb){ const reader=new FileReader(); reader.onload=()=>{ const im=new Image(); im.onload=()=>{ let{width:w,height:h}=im; if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim;} else if(h>maxDim){w=w*maxDim/h;h=maxDim;} const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); cb(cv.toDataURL('image/jpeg',0.72)); }; im.src=reader.result; }; reader.readAsDataURL(file); }
function lightbox(src){ const bd=document.createElement('div'); bd.className='modal-backdrop'; bd.style.cursor='zoom-out'; bd.innerHTML=`<img src="${esc(src)}" style="max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4)" alt="נורה" />`; bd.onclick=()=>bd.remove(); document.body.appendChild(bd); }

      <td style="text-align:left"><button class="icon-btn" data-edit="${c.id}">✏️</button><button class="btn-danger" data-del="${c.id}">🗑</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="card-header"><h2>כללי סיווג אוטומטי</h2><button class="btn" id="add-rule">+ כלל</button></div>

    ${rules.length?`<div class="table-wrap"><table><thead><tr><th>טקסט לזיהוי</th><th>קטגוריה</th><th></th></tr></thead><tbody>${rules.map(r=>`<tr><td><code>${esc(r.match_text)}</code></td><td><span class="badge" style="background:var(--chip)">${esc(r.category_name)}</span></td><td style="text-align:left"><button class="btn-danger" data-delrule="${r.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין כללים עדיין.</div>'}</div>`;
  const mainOpts=(sel)=>cats.filter(c=>!c.parent_id).sort((a,b)=>a.name.localeCompare(b.name,'he')).map(mc=>`<option value="${mc.id}" ${mc.id==sel?'selected':''}>${esc(mc.name)}${mc.kind==='income'?' (הכנסה)':''}</option>`).join('');
  const catForm=(c={})=>`<div class="field-row"><div class="field"><label>שם *</label><input name="name" value="${esc(c.name||'')}" required /></div><div class="field"><label>צבע</label><input name="color" type="color" value="${esc(c.color||'#0f766e')}" /></div></div>
    <div class="field"><label>תת-קטגוריה של… (השאירו «ללא» לקטגוריה ראשית)</label><select name="parent_id"><option value="">— קטגוריה ראשית —</option>${mainOpts(c.parent_id)}</select><div class="hint">תת-קטגוריה יורשת את הסוג והשיוך של הראשית; הגרפים יאחדו אותה תחת הראשית.</div></div>
    <div class="field-row"><div class="field"><label>סוג</label><select name="kind"><option value="expense" ${c.kind!=='income'?'selected':''}>הוצאה</option><option value="income" ${c.kind==='income'?'selected':''}>הכנסה</option></select></div><div class="field"><label>תקציב חודשי (₪)</label><input name="monthly_budget" type="number" step="0.01" min="0" value="${c.monthly_budget??''}" /></div></div>

  el.querySelectorAll('[data-delrule]').forEach(b=>b.onclick=()=>confirmDelete('למחוק כלל זה?',async()=>{await api('/rules/'+b.dataset.delrule,{method:'DELETE'});toast('נמחק');render();}));

// ===== Analytics =====
views.analytics=async()=>{
  const [rows,cats,allRows]=await Promise.all([api('/transactions'+monthParam()),api('/categories'),api('/transactions')]);
  const isMortT=t=>/משכנתא/.test((t.merchant||'')+(t.description||'')) || t.main_name===MORTGAGE_NAME || t.category_name===MORTGAGE_NAME;
  const isRentInc=t=>/שכר דירה|שכירות|שוכר/.test((t.merchant||'')+' '+(t.description||'')) || t.category_name===RENT_INCOME_NAME || t.main_name===RENT_INCOME_NAME;
  const expCash=rows.filter(t=>t.kind==='expense'&&countsInTotal(t)&&!isMortT(t)); // תזרים אחזקת בית (ללא משכנתא)
  const exp=rows.filter(t=>t.kind==='expense'&&countsEssence(t)&&!isMortT(t));       // מהות (פילוח/סיווג) — ללא משכנתא
  const totalExp=expCash.reduce((s,t)=>s+t.amount,0);
  const mortAll=rows.filter(t=>t.kind==='expense'&&countsInTotal(t)&&isMortT(t)).reduce((s,t)=>s+t.amount,0);
  const catMap={}; exp.forEach(t=>{ const name=t.main_name||'ללא סיווג'; if(!catMap[name])catMap[name]={label:name,value:0,color:t.main_color||'#94a3b8'}; catMap[name].value+=t.amount; });
  const byCat=Object.values(catMap).sort((a,b)=>b.value-a.value);
  // מקור אמיתי של ההוצאה: אשראי (שורת פירוט מכרטיס) / מזומן (משיכה) / בנק (הו״ק, העברה, משכנתא, שיק).
  // לא מסתמכים על שדה source הגולמי כי חלק מהעסקאות שיובאו מהבנק תויגו בטעות כ-credit_card.
  const outKind=(t)=> isCardDetail(t)?'credit' : (/משיכה|מזומן|כספומט|בנקט/.test((t.merchant||'')+' '+(t.description||''))?'cash':'bank');
  const srcMeta={credit:{label:'💳 כרטיס אשראי',color:'#6366f1'},bank:{label:'🏦 חשבון בנק (הו״ק/העברות/משכנתא)',color:'#0ea5e9'},cash:{label:'💵 מזומן',color:'#16a34a'}};
  const srcMap={}; expCash.forEach(t=>{ const k=outKind(t); if(!srcMap[k])srcMap[k]={label:srcMeta[k].label,value:0,color:srcMeta[k].color}; srcMap[k].value+=t.amount; });
  const bySrc=Object.values(srcMap).sort((a,b)=>b.value-a.value);
  // חיובים מרוכזים שטרם פורטו (מסבירים את הפער בין תזרים לפילוח)
  const mortSum=mortAll;
  const detailIssuers=new Set(rows.filter(t=>t.kind==='expense'&&isCardDetail(t)).map(t=>detectIssuer(t.account)));
  const pendingSum=detailIssuers.size>0? 0 : expCash.filter(t=>isAggLump(t)&&!detailIssuers.has(detectIssuer(t.merchant||t.description))).reduce((s,t)=>s+t.amount,0);
  const homeCost=totalExp;
  // הכי הרבה הוצאתי על… — מקובץ לפי קטגוריה (מסעדות/דלק/ביטוח יחד). לא-מסווג מוצג לפי בית עסק.
  const spendMap={}; exp.forEach(t=>{ if(/משכנתא/.test((t.merchant||'')+(t.description||''))) return;
    const label = t.main_name ? t.main_name : ((t.merchant||t.description||'—').trim()+' · ללא סיווג');
    const color = t.category_id ? (t.main_color||'#7c3aed') : '#f59e0b';
    if(!spendMap[label]) spendMap[label]={label,value:0,color}; spendMap[label].value+=t.amount; });
  const topMerch=Object.values(spendMap).sort((a,b)=>b.value-a.value).slice(0,12);
  const uncat=exp.filter(t=>!t.category_id).reduce((s,t)=>s+t.amount,0);
  // הכנסות — ללא הכנסת שכירות (מנוהלת בנפרד מול המשכנתא)
  const rentSum=rows.filter(t=>t.kind==='income'&&isRentInc(t)).reduce((s,t)=>s+t.amount,0);
  const incRows=rows.filter(t=>t.kind==='income'&&!isRentInc(t));
  const totalInc=incRows.reduce((s,t)=>s+t.amount,0);
  const incMap={}; incRows.forEach(t=>{ const name=t.category_name||'ללא סיווג'; if(!incMap[name])incMap[name]={label:name,value:0,color:t.category_color||'#94a3b8'}; incMap[name].value+=t.amount; });
  const byInc=Object.values(incMap).sort((a,b)=>b.value-a.value);
  const net=totalInc-totalExp;
  // תקציב מול ביצוע (לפי תקציב חודשי שהוגדר לקטגוריה)
  const actualByCat={}; exp.forEach(t=>{ if(t.category_id){ const mc=catMain(t.category_id); const k=mc?mc.id:t.category_id; actualByCat[k]=(actualByCat[k]||0)+t.amount; } });
  const budgetRows=cats.filter(c=>c.kind==='expense'&&c.monthly_budget>0&&!c.parent_id).map(c=>({name:c.name,color:c.color,budget:c.monthly_budget,actual:actualByCat[c.id]||0})).sort((a,b)=>b.actual/b.budget-a.actual/a.budget);
  const budgetHTML = budgetRows.length ? budgetRows.map(b=>{ const pct=Math.min(100,Math.round(b.actual/b.budget*100)); const over=b.actual>b.budget;
    return `<div class="bar-row" style="margin-bottom:14px"><div class="bar-label" title="${esc(b.name)}">${esc(b.name)}</div>
      <div class="bar-track" style="height:12px"><div class="bar-fill" style="width:${pct}%;background:${over?'linear-gradient(90deg,#f0883e,var(--red))':'var(--grad)'}"></div></div>
      <div class="bar-value tnum" style="width:150px">${money(b.actual)} / ${money(b.budget)}${over?` <span class="pill status-late" style="padding:1px 7px">חריגה</span>`:''}</div></div>`;
  }).join('') : `<div class="empty">לא הוגדרו תקציבים. הגדירו «תקציב חודשי» לקטגוריות ב<a class="link" data-nav="categories">מסך הקטגוריות</a> כדי לעקוב אחר תקציב מול ביצוע.</div>`;
  const el=document.createElement('div');
  el.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card income"><div class="label">💰 הכנסות ${state.month?'בחודש':'כולל'}</div><div class="value tnum">${money(totalInc)}</div><div class="sub">${rentSum?`ללא שכירות ₪${Math.round(rentSum).toLocaleString('en-US')} <span class="muted">(מנוהלת בנפרד מול המשכנתא)</span>`:'ללא הכנסת שכירות'}</div></div>
      <div class="stat-card expense"><div class="label">💸 הוצאות אחזקת בית ${state.month?'בחודש':'כולל'}</div><div class="value tnum">${money(homeCost)}</div><div class="sub">${mortSum?`ללא משכנתא ₪${Math.round(mortSum).toLocaleString('en-US')} <span class="muted">(מנוהלת בנפרד)</span>`:'ללא משכנתא'}</div></div>
      <div class="stat-card ${net>=0?'income':'expense'}"><div class="label">${net>=0?'📈':'📉'} מאזן אחזקת בית</div><div class="value tnum">${money(net)}</div><div class="sub">הכנסות − הוצאות (ללא משכנתא/שכירות)</div></div>
      <div class="stat-card ${uncat||pendingSum?'warn':'accent'}"><div class="label">🏷️ לא מסווג / לא פורט</div><div class="value tnum">${money(uncat+pendingSum)}</div><div class="sub">${uncat?`ללא סיווג ${money(uncat)}`:''}${pendingSum?`${uncat?' · ':''}אשראי לא פורט ${money(pendingSum)}`:''} · <a class="link" data-nav="review">טפל ←</a></div></div>
    </div>
    ${pendingSum?`<div class="hintbar" style="border-color:color-mix(in srgb,var(--amber) 40%,var(--border));background:color-mix(in srgb,var(--amber) 8%,transparent)">🔗 <strong>${money(pendingSum)}</strong> נמצאים ב<strong>חיובי אשראי מרוכזים שטרם פורטו</strong> — לכן חלק מההוצאות (מזון, מסעדות, דלק…) עדיין לא מופיעות בפילוח לפי קטגוריה. <a class="link" data-nav="import">העלה את תדפיסי הכרטיסים</a> כדי לפרק אותם ולראות את התמונה המלאה.</div>`:''}
    <div id="deep-anchor"></div>
    <div class="section-head"><h2>🎯 תקציב וביצוע</h2><span class="rule"></span></div>
    <div class="panel" style="margin-bottom:22px"><h3>תקציב מול ביצוע ${state.month?'(בחודש הנבחר)':'(בחרו חודש להשוואה מדויקת)'}</h3><button class="btn" id="set-budgets" style="margin-bottom:14px">✏️ הגדרת תקציבים לכל הקטגוריות</button>${budgetHTML}</div>
    <div class="section-head"><h2>📊 פילוחים מפורטים</h2><span class="rule"></span></div>
    <div class="panels">
      <div class="panel" data-drill="exp"><h3>הוצאות לפי מהות (קטגוריה)</h3>${donut(byCat,true)}</div>
      <div class="panel" data-drill="exp"><h3>פילוח הוצאות מלא</h3>${barsHTML(byCat.map(c=>({label:c.label,value:c.value,color:c.color})),money,true)}</div>
      <div class="panel" data-drill="src"><h3>הוצאות לפי מקור (אשראי / בנק / מזומן)</h3>${donut(bySrc,true)}</div>
      <div class="panel" data-drill="exp"><h3>הכי הרבה הוצאתי על… (לפי קטגוריה)</h3>${barsHTML(topMerch,money,true)}</div>
      <div class="panel" data-drill="inc"><h3>הכנסות לפי מהות</h3>${donut(byInc,true)}</div>
      <div class="panel" data-drill="inc"><h3>פילוח הכנסות מלא</h3>${barsHTML(byInc.map(c=>({label:c.label,value:c.value,color:c.color})),money,true)}</div>
    </div>`;

  /* ===================== מגמות עומק ותובנות — כל התקופה ===================== */
  const isMort=t=>/משכנתא/.test((t.merchant||'')+(t.description||'')) || t.main_name===MORTGAGE_NAME || t.category_name===MORTGAGE_NAME;
  const curYM=(()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
  const A=allRows;
  const mSet=new Set(A.filter(t=>t.kind==='expense'||t.kind==='income').map(t=>String(t.tx_date).slice(0,7)).filter(s=>s.length===7));
  const months=[...mSet].sort();
  // הכנסות = ללא שכירות (מנוהלת בנפרד); הוצאות = ללא משכנתא (מנוהלת בנפרד) — כדי שכל המגמות עקביות
  const M={}; months.forEach(m=>M[m]={home:0,expense:0,income:0,mort:0,rent:0,txCount:0,ess:0});
  A.forEach(t=>{ const m=String(t.tx_date).slice(0,7); if(!M[m])return;
    if(t.kind==='income'){ if(isRentInc(t))M[m].rent+=t.amount; else M[m].income+=t.amount; return; }
    if(t.kind!=='expense')return;
    if(countsEssence(t)&&!isMort(t)) M[m].ess+=t.amount;
    if(countsInTotal(t)){ if(isMort(t)){M[m].mort+=t.amount;} else {M[m].expense+=t.amount; M[m].home+=t.amount; M[m].txCount++;} } });
  // חודש חלקי = חודש שפירוט האשראי אינו מכסה אותו במלואו (מהחודש של תאריך האשראי האחרון והלאה) או חודש נוכחי/דל-עסקאות
  const lastCardDate=A.filter(t=>t.kind==='expense'&&isCardDetail(t)).reduce((mx,t)=>String(t.tx_date)>mx?String(t.tx_date):mx,'');
  const partialOf=(ym)=> ym===curYM || (lastCardDate&&ym>=lastCardDate.slice(0,7)) || M[ym].txCount<20;
  const complete=months.filter(m=>!partialOf(m));
  const partialMonths=months.filter(m=>!complete.includes(m));
  const avg=arr=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;

  el.querySelectorAll('.panel[data-drill] .bar-row[data-barlabel]').forEach(row=>row.onclick=()=>{

    let list, title=label;
    if(kind==='inc'){ list=incRows.filter(t=>(t.category_name||'ללא סיווג')===label); }
    else if(kind==='merch'){ list=purchScoped.filter(t=>(t.merchant||t.description||'—').trim()===label); }
    else if(kind==='merchfixed'){ const mer=label.replace(/ · \d+ חוד׳$/,''); title=mer; list=purchScoped.filter(t=>(t.merchant||t.description||'—').trim()===mer); }
    else if(kind==='src'){ const key=Object.keys(srcMeta).find(k=>srcMeta[k].label===label); list=expCash.filter(t=>outKind(t)===key); }
    else if(kind==='bucket'){ const b=label.indexOf('חיוני')===0?'חיוני':label.indexOf('מותרות')===0?'מותרות':'אחר'; list=scopedEss.filter(t=>bucketOf(t.main_name||'')===b); }
    else if(kind==='fixed'){ const wantFix=label.indexOf('קבוע')===0; list=purchScoped.filter(t=>isFixedMer((t.merchant||t.description||'—').trim())===wantFix); }
    else if(kind==='dow'){ const di=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'].indexOf(label); list=scopedEss.filter(t=>{ const [y,mo,d]=String(t.tx_date).slice(0,10).split('-').map(Number); return y&&new Date(y,mo-1,d).getDay()===di; }); title='יום '+label; }
    else if(/· ללא סיווג$/.test(label)){ const mer=label.replace(/ · ללא סיווג$/,''); list=exp.filter(t=>!t.category_id && (t.merchant||t.description||'—').trim()===mer); }
    else { list=exp.filter(t=>(t.main_name||'ללא סיווג')===label); }
    showTxDrill(`${title} · ${money((list||[]).reduce((s,t)=>s+t.amount,0))}`, list||[]);
  });
  return el;
};
// חלון פירוט: כל העסקאות שמרכיבות מספר בגרף — עם אפשרות לשנות סיווג בשורה
function showTxDrill(title,list){
  list=list.slice().sort((a,b)=>b.amount-a.amount);
  // רשימת כרטיסים רספונסיבית — עובד יפה גם במובייל (במקום טבלה רחבה שנחתכת)
  const body=`<div class="hint" style="margin-bottom:12px">${list.length} עסקאות · שינוי סיווג כאן חל על אותו בית עסק בכל החודשים ומתעדכן בגרפים.</div>
    <div class="drill-list" style="max-height:60vh;overflow:auto">${list.map(t=>`<div class="drill-item">
        <div class="drill-row"><span class="drill-date tnum">${fmtDate(t.tx_date)}</span><span class="drill-merch">${esc(t.merchant||t.description||'—')}</span><span class="drill-amt tnum ${t.kind==='income'?'amount-pos':'amount-neg'}">${money2(t.amount)}</span></div>
        <select class="drill-cat" data-merch="${esc((t.merchant||t.description||'').trim())}" data-id="${t.id}">${catSelectOptions(db.categories,t.category_id)}</select>
      </div>`).join('')||'<div class="empty">אין עסקאות</div>'}</div>`;
  openModal(title,body,async()=>{},{wide:true,submitLabel:'סגירה'});
  setTimeout(()=>{ document.querySelectorAll('.modal .drill-cat').forEach(sel=>sel.onchange=async()=>{
    const merch=sel.dataset.merch, val=sel.value;
    try{ await api('/transactions/classify-similar',{method:'POST',body:{merchant:merch,tx_id:sel.dataset.id,category_id:val||null,make_rule:!!val}});
      toast('סווג מחדש ✓'); const bd=sel.closest('.modal-backdrop'); if(bd) bd.remove(); render();
    }catch(e){ toast(e.message,true); } }); },0);
}

// ===== כל הסיווגים — מנהל מרכזי לצפייה, שינוי ועריכה של סיווג כל בתי העסק =====
views.classifyall=async()=>{
  let rows,cats;
  const load=async()=>{ [rows,cats]=await Promise.all([api('/transactions'),api('/categories')]); };
  await load();
  // קיבוץ כל ההוצאות לפי בית עסק
  const buildGroups=()=>{
    const map={};
    rows.filter(t=>t.kind==='expense').forEach(t=>{
      const key=(t.merchant||t.description||'—').trim()||'—';
      if(!map[key]) map[key]={merchant:key,count:0,total:0,catCount:{}};
      const g=map[key]; g.count++; g.total+=Number(t.amount)||0;
      const cid=t.category_id||'__none'; g.catCount[cid]=(g.catCount[cid]||0)+1;
    });
    return Object.values(map).map(g=>{
      // הסיווג הנפוץ ביותר בקבוצה = הסיווג המייצג
      let best='__none',bn=-1; for(const k in g.catCount){ if(g.catCount[k]>bn){bn=g.catCount[k];best=k;} }
      const cid=best==='__none'?null:best;
      const c=cats.find(x=>x.id==cid);
      const isOther = !c || c.name==='אחר' || c.name==='הכנסה אחרת';
      const full = c ? (catLabel(cid)||c.name) : 'ללא סיווג';
      return {merchant:g.merchant,count:g.count,total:g.total,category_id:cid,full,isOther,mixed:Object.keys(g.catCount).length>1};
    }).sort((a,b)=>b.total-a.total);
  };
  let groups=buildGroups();
  const totMerch=groups.length, otherCount=groups.filter(g=>g.isOther).length;

  const el=document.createElement('div');
  el.innerHTML=`
    <div class="cards-row" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
      <div class="stat-card accent"><div class="label">🏬 בתי עסק</div><div class="value tnum">${totMerch}</div></div>
      <div class="stat-card ${otherCount?'expense':'accent'}"><div class="label">🔴 מסווגים כ"אחר" / ללא</div><div class="value tnum">${otherCount}</div></div>
      <div class="stat-card accent"><div class="label">🗂️ קטגוריות</div><div class="value tnum">${cats.filter(c=>c.kind==='expense'&&!c.parent_id).length}</div><div class="sub"><a class="link" data-nav="categories">נהל קטגוריות ←</a></div></div>
    </div>
    <p class="hintbar">כאן רואים <strong>את כל בתי העסק</strong> ואת הסיווג שלהם במקום אחד. שינוי הסיווג של בית עסק חל על <strong>כל העסקאות שלו בכל החודשים</strong> ומתעדכן מיד בכל הגרפים והדוחות. חפשו, סננו לפי קטגוריה, או הציגו רק את מה שעדיין לא מסווג כראוי.</p>
    <div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <input id="c-txt" placeholder="🔎 חיפוש בית עסק…" style="flex:1;min-width:200px">
      <select id="c-catf" style="min-width:180px"><option value="">כל הקטגוריות</option><option value="__other">רק "אחר" / ללא סיווג</option>${cats.filter(c=>c.kind==='expense'&&!c.parent_id).sort((a,b)=>strv(a.name).localeCompare(strv(b.name),'he')).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <label class="hint" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="c-only"> רק לא מסווגים כראוי</label>
      <button class="btn" id="c-newcat">➕ קטגוריה חדשה</button>
      <a class="link" data-nav="categories" style="white-space:nowrap">✏️ עריכה/מחיקה של קטגוריות ←</a>
    </div>
    <div class="hint" style="margin-top:8px">כדי <strong>להוסיף</strong> קטגוריה או תת-קטגוריה — «➕ קטגוריה חדשה». כדי <strong>לשנות שם, צבע או למחוק</strong> קטגוריה — עברו למסך «קטגוריות». כאן משייכים כל בית עסק לאחת הקטגוריות הקיימות.</div></div>
    <div class="card"><div class="table-wrap" style="max-height:66vh;overflow:auto"><table style="width:100%">
      <thead><tr><th>בית עסק</th><th class="tnum">עסקאות</th><th class="tnum">סה"כ</th><th>סיווג נוכחי</th><th style="min-width:200px">שינוי סיווג</th></tr></thead>
      <tbody id="c-tbody"></tbody></table></div></div>`;

  const tbody=el.querySelector('#c-tbody');
  const txt=el.querySelector('#c-txt'), catf=el.querySelector('#c-catf'), only=el.querySelector('#c-only');
  const rowHTML=(g)=>`<tr data-merch="${esc(g.merchant)}">
      <td>${esc(g.merchant)}${g.mixed?' <span class="pill status-soon" title="לבית עסק זה יש כמה סיווגים שונים בעסקאות">מעורב</span>':''}</td>
      <td class="tnum">${g.count}</td>
      <td class="tnum amount-neg">${money(g.total)}</td>
      <td>${g.isOther?'<span class="pill status-late">'+esc(g.full)+'</span>':'<span class="pill status-ok">'+esc(g.full)+'</span>'}</td>
      <td><select class="c-sel" data-merch="${esc(g.merchant)}" style="width:100%">${catSelectOptions(cats,g.category_id)}</select></td></tr>`;
  const applyFilter=()=>{
    const q=strv(txt.value).trim().toLowerCase(), cf=catf.value, onlyOther=only.checked;
    let list=groups;
    if(q) list=list.filter(g=>g.merchant.toLowerCase().includes(q));
    if(onlyOther||cf==='__other') list=list.filter(g=>g.isOther);
    else if(cf) list=list.filter(g=>{ if(!g.category_id) return false; return g.category_id==cf||catMain(g.category_id)?.id==cf; });
    tbody.innerHTML=list.map(rowHTML).join('')||'<tr><td colspan="5"><div class="empty">אין תוצאות</div></td></tr>';
    tbody.querySelectorAll('.c-sel').forEach(sel=>sel.onchange=async()=>{
      const merch=sel.dataset.merch, val=sel.value;
      try{
        await api('/transactions/classify-similar',{method:'POST',body:{merchant:merch,category_id:val||null,make_rule:!!val}});
        toast('סווג מחדש ✓');
        await load(); groups=buildGroups(); applyFilter();
      }catch(e){ toast(e.message,true); }
    });
  };
  txt.oninput=applyFilter; catf.onchange=applyFilter; only.onchange=applyFilter;
  // הוספת קטגוריה / תת-קטגוריה חדשה — ישירות מכאן, בלי לעזוב את המסך
  el.querySelector('#c-newcat').onclick=()=>{
    const mainOpts=cats.filter(c=>!c.parent_id).sort((a,b)=>strv(a.name).localeCompare(strv(b.name),'he')).map(mc=>`<option value="${mc.id}">${esc(mc.name)}${mc.kind==='income'?' (הכנסה)':''}</option>`).join('');
    const form=`<div class="field-row"><div class="field"><label>שם *</label><input name="name" required placeholder="לדוגמה: אוכל בחוץ / דלק" /></div><div class="field"><label>צבע</label><input name="color" type="color" value="#0f766e" /></div></div>
      <div class="field"><label>תת-קטגוריה של… (השאירו «ללא» לקטגוריה ראשית)</label><select name="parent_id"><option value="">— קטגוריה ראשית —</option>${mainOpts}</select><div class="hint">תת-קטגוריה מוצגת בגרפים תחת הקטגוריה הראשית שלה.</div></div>
      <div class="field-row"><div class="field"><label>סוג</label><select name="kind"><option value="expense" selected>הוצאה</option><option value="income">הכנסה</option></select></div><div class="field"><label>תקציב חודשי (₪)</label><input name="monthly_budget" type="number" step="0.01" min="0" /></div></div>
      <div class="field"><label><input type="checkbox" name="is_home" checked /> נספר בעלות אחזקת הבית</label></div>`;
    openModal('קטגוריה חדשה',form,async fd=>{
      await api('/categories',{method:'POST',body:{...fd,is_home:fd.is_home==='on'}});
      toast('קטגוריה נוספה ✓'); await load(); groups=buildGroups(); applyFilter();
    });
  };
  applyFilter();
  return el;
};

// ===== Reconcile / completeness =====
views.reconcile=async()=>{
  const data=await api('/reconcile');
  const totalBank=data.reduce((s,r)=>s+r.bank,0);
  const pending=data.filter(r=>r.status==='pending'||r.status==='partial');
  const pendingSum=pending.reduce((s,r)=>s+Math.max(0,r.gap),0);
  const overall=totalBank>0?Math.round((1-pendingSum/totalBank)*100):100;
  const stPill=(st)=>({done:'<span class="pill status-ok">הושלם ✓</span>',partial:'<span class="pill status-soon">חלקי</span>',pending:'<span class="pill status-late">חסר פירוט</span>',card_only:'<span class="pill status-none">פירוט בלבד</span>'}[st]||st);
  const el=document.createElement('div');
  el.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card ${overall>=99?'income':overall>=60?'warn':'expense'}"><div class="label">✅ שלמות התמונה</div><div class="value tnum">${overall}%</div><div class="sub">מתוך חיובי האשראי בבנק</div></div>
      <div class="stat-card expense"><div class="label">⏳ ממתין לפירוט</div><div class="value tnum">${money(pendingSum)}</div><div class="sub">${pending.length} חברות אשראי</div></div>
      <div class="stat-card accent"><div class="label">💳 סך חיובי אשראי בבנק</div><div class="value tnum">${money(totalBank)}</div></div>
    </div>
    <p class="hintbar">כל חיוב אשראי בתדפיס הבנק (ישראכרט, כאל, אמריקן אקספרס…) מצריך <strong>פירוט תואם</strong> מאתר חברת האשראי כדי לדעת מה נקנה בפועל. כשמייבאים את הפירוט המלא, סכומו מתקרב לחיוב שבבנק והשורה מסומנת «הושלם». ייבאו במסך «ייבוא תדפיסים» → מקור «כרטיס אשראי», ובשם החשבון כתבו את שם החברה (למשל «ישראכרט»).</p>
    <div class="card">
      ${data.length?`<div class="table-wrap"><table><thead><tr><th>חברת אשראי</th><th>חויב בבנק</th><th>יובא בפירוט</th><th>נותר לפרט</th><th>השלמה</th><th>סטטוס</th></tr></thead>
      <tbody>${data.map(r=>`<tr>
        <td><strong>${esc(r.issuer)}</strong>${r.bankCount?`<div class="hint">${r.bankCount} חיובים בבנק</div>`:''}</td>
        <td class="tnum">${r.bank?money(r.bank):'—'}</td>
        <td class="tnum">${r.card?money(r.card):'—'}${r.cardCount?`<div class="hint">${r.cardCount} עסקאות</div>`:''}</td>
        <td class="tnum ${r.status==='pending'||r.status==='partial'?'amount-neg':''}">${r.bank&&r.gap>2?money(r.gap):'—'}</td>
        <td style="min-width:130px"><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;background:${r.pct>=99?'var(--green)':r.pct>=60?'var(--amber)':'var(--red)'}"></div></div><div class="hint">${r.pct}%</div></td>
        <td>${stPill(r.status)}</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty">עדיין לא זוהו חיובי כרטיסי אשראי. ייבאו תדפיס בנק, ואז ייבאו את פירוטי כרטיסי האשראי — כאן תראו כמה מהתמונה כבר מלאה.</div>'}
    </div>`;
  return el;
};

// ===== Monthly workspace: כל ההוצאות לפי חודש, עם סיווג (קטגוריה + תת-קטגוריה) בשורה =====
views.monthly=async()=>{
  const [rows,cats]=await Promise.all([api('/transactions'),api('/categories')]);
  const curYM=new Date().toISOString().slice(0,7);
  const detailIssuers=new Set(rows.filter(t=>t.kind==='expense'&&isCardDetail(t)).map(t=>detectIssuer(t.account)));
  const compDetail=detailIssuers.size>0; // תדפיסי פירוט הועלו — מכסים את כל הכרטיסים בתדפיס המשולב
  // עד איזה תאריך יש כיסוי של פירוט אשראי (מעבר לזה — חודש חלקי עד שיועלה התדפיס הבא)
  const lastCardDate=rows.filter(t=>t.kind==='expense'&&isCardDetail(t)).reduce((mx,t)=>String(t.tx_date)>mx?String(t.tx_date):mx,'');
  const isMort=(t)=>/משכנתא/.test((t.merchant||'')+' '+(t.description||''));
  const months={};
  const M=(ym)=>(months[ym]=months[ym]||{ym,txCount:0,incSum:0,expSum:0,mortgage:0,pending:0,mer:{},lumps:{},classified:0,unclSum:0,unclCount:0});
  rows.forEach(r=>{ const ym=String(r.tx_date).slice(0,7); if(ym.length!==7||ym>curYM) return;
    const mm=M(ym); mm.txCount++;
    if(r.kind==='income'){ mm.incSum+=r.amount; return; }
    if(countsInTotal(r)){ mm.expSum+=r.amount; if(isMort(r)) mm.mortgage+=r.amount;
      if(isAggLump(r) && !compDetail && !detailIssuers.has(detectIssuer(r.merchant||r.description))) mm.pending+=r.amount; }
    if(isAggLump(r)){ const k=detectIssuer(r.merchant||r.description)||'אשראי'; const g=mm.lumps[k]=mm.lumps[k]||{total:0,count:0,hasDetail:compDetail||detailIssuers.has(k)}; g.total+=r.amount; g.count++; }
    if(countsEssence(r) && !isMort(r)){ const key=(r.merchant||r.description||'—').trim()||'—';
      const g=mm.mer[key]=mm.mer[key]||{key,total:0,count:0,cat:r.category_id||null};
      g.total+=r.amount; g.count++; if(r.category_id) g.cat=r.category_id;
      if(r.category_id) mm.classified+=r.amount; else { mm.unclSum+=r.amount; mm.unclCount++; } } });
  const list=Object.values(months).sort((a,b)=>b.ym.localeCompare(a.ym));
  const el=document.createElement('div');
  if(!list.length){ el.innerHTML='<div class="card"><div class="empty">אין עדיין עסקאות. ייבאו תדפיס במסך «ייבוא תדפיסים».</div></div>'; return el; }
  const totalUncCount=list.reduce((s,m)=>s+m.unclCount,0);
  // חודש «חלקי» = פירוט האשראי לא מכסה אותו במלואו (מתאריך הכיסוי האחרון והלאה)
  const partialOf=(ym)=> lastCardDate && ym>=lastCardDate.slice(0,7);
  // אומדן = ממוצע החודשים המלאים בעלי מספיק נתונים (מסננים חודשים דלים/חלקיים בקצה)
  const completeHomes=list.filter(mm=>!partialOf(mm.ym)&&mm.txCount>=20).map(mm=>mm.expSum-mm.mortgage).filter(v=>v>0);
  const avgHome = completeHomes.length? Math.round(completeHomes.reduce((a,b)=>a+b,0)/completeHomes.length) : 0;
  const openSet = state.monthlyOpen || (state.monthlyOpen=new Set());
  if(!openSet.size && list[0]) openSet.add(list[0].ym); // ברירת מחדל: החודש האחרון פתוח
  const mainList=cats.filter(c=>c.kind==='expense'&&!c.parent_id).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  const subsOf=(mid)=>cats.filter(c=>c.parent_id==mid).sort((a,b)=>a.name.localeCompare(b.name,'he'));
  const mainOpts=(sel)=>`<option value="">— קטגוריה —</option>`+mainList.map(mc=>`<option value="${mc.id}" ${mc.id==sel?'selected':''}>${esc(mc.name)}</option>`).join('');
  const subOpts=(mid,sel)=>{ const subs=mid?subsOf(mid):[]; return `<option value="">${subs.length?'— תת-קטגוריה —':'(אין תת-קטגוריות)'}</option>`+subs.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${esc(s.name)}</option>`).join(''); };
  el.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card accent"><div class="label">📅 חודשים</div><div class="value tnum">${list.length}</div></div>
      <div class="stat-card ${totalUncCount?'expense':'accent'}"><div class="label">🔴 עסקאות לא מסווגות</div><div class="value tnum">${totalUncCount}</div></div>
      <div class="stat-card accent"><div class="label">🗂️ קטגוריות</div><div class="value tnum">${cats.filter(c=>c.kind==='expense'&&!c.parent_id).length}</div><div class="sub"><a class="link" data-nav="categories">נהל קטגוריות ותת-קטגוריות ←</a></div></div>
    </div>
    <p class="hintbar">לחצו על חודש כדי לראות את <strong>כל ההוצאות</strong> שלו. לכל בית עסק בחרו <strong>קטגוריה או תת-קטגוריה</strong> ישירות מהרשימה — הסיווג חל על אותו בית עסק בכל החודשים ומתעדכן מיד בכל הגרפים. אדום = עדיין לא מסווג.</p>
    <div id="mlist">${list.map(m=>{
      const mers=Object.values(m.mer).sort((a,b)=>b.total-a.total);
      const home=m.expSum-m.mortgage; const pct=(m.classified+m.unclSum)>0?Math.round(m.classified/(m.classified+m.unclSum)*100):100;
      const cardPartial = partialOf(m.ym); const showEst = cardPartial && avgHome>0;
      return `<div class="card" style="margin-bottom:12px">
        <div class="mrow" data-ym="${m.ym}" style="display:flex;align-items:center;gap:14px;cursor:pointer;padding:4px 2px">

            ${cardPartial?`<span class="pill status-soon" style="margin-inline-start:6px" title="פירוט האשראי מכסה עד ${fmtDate(lastCardDate)} — השאר יופיע כשיועלה התדפיס הבא. מוצג אומדן חודשי מלא.">⏳ חלקי · אומדן (אשראי עד ${fmtDate(lastCardDate)})</span>`:''}</div>
          <div style="text-align:end">${showEst

            : `<div class="tnum amount-neg" style="font-size:16px">${money(m.expSum)}</div><div class="hint">אחזקת בית ${money(home)}${m.mortgage?` · משכנתא ${money(m.mortgage)}`:''} · מסווג ${pct}%</div>`}</div>
        </div>

          <div class="table-wrap"><table style="width:100%"><thead><tr><th>בית עסק</th><th style="width:52%">קטגוריה + תת-קטגוריה</th><th>סכום</th></tr></thead>
          <tbody>${mers.map(g=>{ const cat=g.cat?catById(g.cat):null; const mid=cat?(cat.parent_id||cat.id):''; const sid=(cat&&cat.parent_id)?cat.id:'';

            <td><strong>${esc(g.key)}</strong>${g.count>1?`<span class="hint"> ×${g.count}</span>`:''}</td>
            <td><div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap"><select class="mmain" data-merch="${esc(g.key)}" style="flex:1;min-width:110px">${mainOpts(mid)}</select><select class="msub" data-merch="${esc(g.key)}" data-main="${mid}" style="flex:1;min-width:110px">${subOpts(mid,sid)}</select><button class="btn-ghost mnew" data-merch="${esc(g.key)}" title="קטגוריה/תת-קטגוריה חדשה" style="padding:4px 8px">➕</button></div></td>
            <td class="tnum amount-neg">${money(g.total)}</td></tr>`; }).join('')}</tbody></table></div>

  el.querySelectorAll('.mrow').forEach(row=>row.onclick=(e)=>{ if(e.target.closest('[data-nav]'))return; const ym=row.dataset.ym; const body=el.querySelector(`[data-body="${ym}"]`); const chev=row.querySelector('.mchev'); const open=body.style.display!=='none'; body.style.display=open?'none':'block'; chev.style.transform=open?'':'rotate(90deg)'; if(open) openSet.delete(ym); else openSet.add(ym); });
  const classifyMerch=async(key,catId)=>{ try{ await api('/transactions/classify-similar',{method:'POST',body:{merchant:key,category_id:catId||null,make_rule:!!catId}}); toast(catId?'סווג ✓':'הוסר סיווג'); render(); }catch(err){ toast(err.message,true); } };

  });

// ===== מאזן והצלבה חודשית: יתרת פתיחה + הכנסות − הוצאות = יתרת סגירה =====
views.balance=async()=>{
  const rows=await api('/transactions');
  const curYM=new Date().toISOString().slice(0,7);
  const months={};
  const M=(ym)=>(months[ym]=months[ym]||{ym,income:0,exp:0,bySrc:{}});
  // סיווג ההוצאה למקור אמיתי: קניית אשראי (חשבון=חברה) / משיכת מזומן / שאר תנועות בנק
  const outKind=(t)=> isCardDetail(t)?'credit' : (/משיכה|מזומן|כספומט|בנקט/.test((t.merchant||'')+' '+(t.description||''))?'cash':'bank');
  rows.forEach(t=>{ const ym=String(t.tx_date).slice(0,7); if(ym.length!==7||ym>curYM) return; const mm=M(ym);
    if(t.kind==='income'){ mm.income+=t.amount; return; }
    if(countsInTotal(t)){ mm.exp+=t.amount; const k=outKind(t); mm.bySrc[k]=(mm.bySrc[k]||0)+t.amount; } });
  const list=Object.values(months).sort((a,b)=>a.ym.localeCompare(b.ym)); // ישן → חדש (לצורך יתרה מתגלגלת)
  const opening0=numv(db.openingBalance)||0;
  let bal=opening0; const data=list.map(m=>{ const open=bal; const net=m.income-m.exp; const close=open+net; bal=close;
    const credit=m.bySrc['credit']||0, bank=m.bySrc['bank']||0, cash=m.bySrc['cash']||0;
    return {...m,open,net,close,credit,bank,cash}; });
  const sum=(k)=>data.reduce((s,m)=>s+m[k],0);
  const el=document.createElement('div');
  el.innerHTML=`
    <div class="card" style="margin-bottom:16px"><div class="card-header"><h2>🧮 מאזן והצלבה חודשית</h2></div>
      <div style="padding:6px 20px 16px">
        <p class="hint" style="margin-bottom:12px">בכל חודש: <strong>יתרת פתיחה + הכנסות − הוצאות = יתרת סגירה</strong> — והסגירה הופכת לפתיחה של החודש הבא. כך רואים שכל היתרות «נסגרות», וההוצאות מסוכמות לפי מקור: <strong>אשראי / בנק / מזומן</strong>.</p>
        <div class="field" style="max-width:300px"><label>יתרת פתיחה התחלתית בבנק (₪)</label><input id="open-bal" type="number" step="0.01" value="${opening0}" /><div class="hint">הזינו את יתרת חשבון הבנק בתחילת התקופה — כדי שהיתרות יהיו אמיתיות.</div></div>
      </div></div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>חודש</th><th>יתרת פתיחה</th><th>+ הכנסות</th><th>− אשראי</th><th>− בנק</th><th>− מזומן</th><th>= תזרים נטו</th><th>יתרת סגירה</th></tr></thead>
      <tbody>${data.map(m=>`<tr>
        <td><strong>${fmtMonth(m.ym)}</strong></td>
        <td class="tnum">${money(m.open)}</td>
        <td class="tnum amount-pos">${m.income?money(m.income):'—'}</td>
        <td class="tnum amount-neg">${m.credit?money(m.credit):'—'}</td>
        <td class="tnum amount-neg">${m.bank?money(m.bank):'—'}</td>
        <td class="tnum amount-neg">${m.cash?money(m.cash):'—'}</td>
        <td class="tnum ${m.net>=0?'amount-pos':'amount-neg'}">${m.net>=0?'+':'−'}${money(Math.abs(m.net))}</td>
        <td class="tnum" style="font-weight:800;${m.close<0?'color:var(--red)':''}">${money(m.close)}</td>
      </tr>`).join('')||'<tr><td colspan="8"><div class="empty">אין עדיין עסקאות.</div></td></tr>'}</tbody>
      ${data.length?`<tfoot><tr style="font-weight:800;background:var(--surface-2)">
        <td>סה״כ תקופה</td><td class="tnum">${money(opening0)}</td>
        <td class="tnum amount-pos">${money(sum('income'))}</td>
        <td class="tnum amount-neg">${money(sum('credit'))}</td>
        <td class="tnum amount-neg">${money(sum('bank'))}</td>
        <td class="tnum amount-neg">${money(sum('cash'))}</td>
        <td class="tnum ${sum('net')>=0?'amount-pos':'amount-neg'}">${sum('net')>=0?'+':'−'}${money(Math.abs(sum('net')))}</td>
        <td class="tnum">${money(data[data.length-1].close)}</td></tr></tfoot>`:''}
    </table></div></div>
    <p class="hintbar" style="margin-top:14px">💡 «יתרת סגירה» היא יתרת הבנק המשוערת בסוף כל חודש (לפי כל ההכנסות וההוצאות שנקלטו). אם היא לא תואמת לדף הבנק שלכם — סימן שחסר תדפיס או עסקה, וכדאי לייבא את מה שחסר.</p>`;
  const inp=el.querySelector('#open-bal'); if(inp) inp.onchange=()=>{ db.openingBalance=numv(inp.value); save(); toast('יתרת פתיחה עודכנה'); render(); };
  return el;
};

/* ============================ Router ============================ */
const TITLES={dashboard:'דשבורד',analytics:'גרפים וניתוח',transactions:'עסקאות',review:'סיווג עסקאות',classifyall:'כל הסיווגים',import:'ייבוא תדפיסים',monthly:'לפי חודש',balance:'מאזן והצלבה',reconcile:'השלמות אשראי',recurring:'הוצאות קבועות',maintenance:'תחזוקה ורכיבים',warranties:'תעודות אחריות',documents:'ארכיון מסמכים',professionals:'בעלי מקצוע',lighting:'תאורה ונורות',categories:'קטגוריות וכללים',settings:'הגדרות וגיבוי'};
function currentView(){ const hash=location.hash.replace('#/','')||'dashboard'; return views[hash]?hash:'dashboard'; }
async function render(opts){
  opts=(opts&&opts.keepScroll)?opts:{}; // hashchange/אירועים מעבירים Event — מתייחסים אליו כרענדר רגיל
  const name=currentView();
  document.getElementById('page-title').textContent=TITLES[name];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===name));
  document.getElementById('month-wrap').style.visibility=MONTH_VIEWS.has(name)?'visible':'hidden';
  const container=document.getElementById('view');
  const y=window.scrollY;
  // ברענדר שקט (סנכרון רקע) לא מציגים «טוען…» כדי שהגובה לא יקרוס והמסך לא יקפוץ למעלה
  if(!opts.keepScroll) container.innerHTML='<div class="empty">טוען…</div>';
  try{ const el=await views[name](); container.innerHTML=''; container.appendChild(el); }
  catch(err){ container.innerHTML=`<div class="empty">שגיאה: ${esc(err.message)}</div>`; }
  if(opts.keepScroll) window.scrollTo(0,y); // שמירה על מיקום הגלילה
}
document.getElementById('nav').addEventListener('click',e=>{ const a=e.target.closest('a[data-view]'); if(a){ e.preventDefault(); location.hash='#/'+a.dataset.view; } });

try{ const saved=localStorage.getItem('home-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved); }catch(e){}

// טולטיפ אינטראקטיבי לגרפים — מציג את המספר שמעליו מרחפים
(function initChartTips(){
  const tip=document.createElement('div'); tip.id='chart-tip'; let attached=false;
  const place=(e)=>{ const pad=14; const r=tip.getBoundingClientRect(); let x=e.clientX+pad, y=e.clientY+pad;
    if(x+r.width>innerWidth-8) x=e.clientX-r.width-pad; if(y+r.height>innerHeight-8) y=e.clientY-r.height-pad;
    tip.style.left=Math.max(6,x)+'px'; tip.style.top=Math.max(6,y)+'px'; };
  document.addEventListener('mousemove',(e)=>{
    const t=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;
    if(!t){ if(tip.classList.contains('on')) tip.classList.remove('on'); return; }
    if(!attached){ document.body.appendChild(tip); attached=true; }
    const txt=t.getAttribute('data-tip'); if(tip.textContent!==txt) tip.textContent=txt;
    tip.classList.add('on'); place(e);
  }, {passive:true});
  document.addEventListener('scroll',()=>{ if(tip.classList.contains('on')) tip.classList.remove('on'); }, {passive:true,capture:true});

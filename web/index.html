<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🏡</text></svg>">
</head>
<body>
<title>ניהול הבית</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#faf8f4; --sidebar:#0f1f1c;
  --text:#1c1917; --muted:#6f6a63; --border:#e7e2d9;
  --primary:#0f766e; --primary-strong:#0b5f58; --on-primary:#ffffff;
  --green:#15803d; --amber:#b45309; --red:#c0392b; --income:#15803d;
  --chip:#f1efe9; --shadow:0 1px 2px rgba(20,25,23,.06), 0 4px 14px rgba(20,25,23,.05);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1413; --surface:#171d1c; --surface-2:#1d2523; --sidebar:#0a100e;
    --text:#e9e6e1; --muted:#9a958d; --border:#2a3331;
    --primary:#2dd4bf; --primary-strong:#5eead4; --on-primary:#06201c;
    --green:#4ade80; --amber:#fbbf24; --red:#f87171; --income:#4ade80;
    --chip:#232b29; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="light"]{
  --bg:#f6f4ef; --surface:#ffffff; --surface-2:#faf8f4; --sidebar:#0f1f1c;
  --text:#1c1917; --muted:#6f6a63; --border:#e7e2d9;
  --primary:#0f766e; --primary-strong:#0b5f58; --on-primary:#ffffff;
  --green:#15803d; --amber:#b45309; --red:#c0392b; --income:#15803d;
  --chip:#f1efe9; --shadow:0 1px 2px rgba(20,25,23,.06), 0 4px 14px rgba(20,25,23,.05);
}
:root[data-theme="dark"]{
  --bg:#0f1413; --surface:#171d1c; --surface-2:#1d2523; --sidebar:#0a100e;
  --text:#e9e6e1; --muted:#9a958d; --border:#2a3331;
  --primary:#2dd4bf; --primary-strong:#5eead4; --on-primary:#06201c;
  --green:#4ade80; --amber:#fbbf24; --red:#f87171; --income:#4ade80;
  --chip:#232b29; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Assistant","Rubik","Segoe UI",system-ui,-apple-system,"Noto Sans Hebrew",sans-serif;
  background:var(--bg); color:var(--text); direction:rtl; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex; min-height:100vh}
button,input,select,textarea{font-family:inherit}
a{color:var(--primary)}
.tnum{font-variant-numeric:tabular-nums}

/* Sidebar */
.sidebar{width:242px; background:var(--sidebar); color:#cdd8d4; display:flex; flex-direction:column;
  padding:20px 14px; position:sticky; top:0; height:100vh; flex-shrink:0}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 20px}
.brand-logo{font-size:26px}
.brand-name{font-size:19px; font-weight:800; color:#fff; letter-spacing:.2px}
.brand-sub{font-size:11px; color:#7f938d; margin-top:2px}
nav{display:flex; flex-direction:column; gap:3px; overflow-y:auto}
nav a{display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:10px;
  color:#b9c6c1; text-decoration:none; font-weight:600; font-size:14px; cursor:pointer; transition:.14s}
nav a .ico{font-size:17px; width:20px; text-align:center}
nav a:hover{background:rgba(255,255,255,.06); color:#fff}
nav a.active{background:var(--primary); color:var(--on-primary)}
.sidebar-foot{margin-top:auto; padding-top:14px; font-size:11px; color:#6b7d78; display:flex; justify-content:space-between; align-items:center; gap:8px}
.theme-btn{background:rgba(255,255,255,.08); border:none; color:#cdd8d4; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px}
.theme-btn:hover{background:rgba(255,255,255,.16)}

/* Content */
.content{flex:1; display:flex; flex-direction:column; min-width:0}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:18px 28px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap}
.topbar h1{font-size:21px; font-weight:800; margin:0}
.month-picker{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.month-picker input{padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text)}
.view{padding:24px 32px; max-width:none; width:100%}

/* Stat cards */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:15px; margin-bottom:22px}
.stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 19px; box-shadow:var(--shadow)}
.stat-card .label{color:var(--muted); font-size:12.5px; font-weight:600; margin-bottom:9px; display:flex; align-items:center; gap:6px}
.stat-card .value{font-size:25px; font-weight:800; letter-spacing:-.5px}
.stat-card .sub{font-size:12px; color:var(--muted); margin-top:6px}
.stat-card.expense .value{color:var(--red)}
.stat-card.income .value{color:var(--income)}
.stat-card.warn .value{color:var(--amber)}
.stat-card.accent .value{color:var(--primary-strong)}

.panels{display:grid; grid-template-columns:1fr 1fr; gap:18px}
@media (max-width:880px){ .panels{grid-template-columns:1fr} }
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:19px; box-shadow:var(--shadow)}
.panel h3{font-size:15px; margin:0 0 15px; font-weight:700}

/* Cards / tables */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.card-header{display:flex; align-items:center; justify-content:space-between; padding:16px 19px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap}
.card-header h2{font-size:17px; margin:0}
.table-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse}
th,td{padding:11px 18px; text-align:right; white-space:nowrap}
th{background:var(--surface-2); color:var(--muted); font-size:12px; font-weight:700; border-bottom:1px solid var(--border)}
td{border-bottom:1px solid var(--border); font-size:14px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.wrap, th.wrap{white-space:normal}
.empty{padding:40px 20px; text-align:center; color:var(--muted)}

.badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700}
.amount-pos{color:var(--income); font-weight:700}
.amount-neg{color:var(--red); font-weight:700}
.pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700}
.status-ok{background:color-mix(in srgb, var(--green) 16%, transparent); color:var(--green)}
.status-soon{background:color-mix(in srgb, var(--amber) 18%, transparent); color:var(--amber)}
.status-late{background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red)}
.status-none{background:var(--chip); color:var(--muted)}

/* Buttons */
.btn,.btn-ghost,.btn-danger{font-size:14px; font-weight:700; cursor:pointer; border-radius:9px; padding:9px 15px; border:1px solid transparent; transition:.14s}
.btn{background:var(--primary); color:var(--on-primary)}
.btn:hover{background:var(--primary-strong)}
.btn-ghost{background:transparent; color:var(--primary); border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:transparent; color:var(--red); border:none; padding:6px 9px}
.btn-danger:hover{background:color-mix(in srgb, var(--red) 12%, transparent)}
.icon-btn{background:none; border:none; cursor:pointer; font-size:15px; padding:5px 7px; border-radius:7px; color:var(--text)}
.icon-btn:hover{background:var(--surface-2)}

/* Toolbar */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.toolbar select,.toolbar input{padding:8px 11px; border:1px solid var(--border); border-radius:9px; background:var(--surface); color:var(--text); font-size:14px}
.spacer{flex:1}

/* Forms / modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,20,19,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:18px}
.modal{background:var(--surface); border-radius:16px; width:100%; max-width:470px; box-shadow:0 24px 50px rgba(0,0,0,.28); animation:pop .16s ease; max-height:92vh; display:flex; flex-direction:column}
.modal.wide{max-width:660px}
@keyframes pop{from{transform:scale(.97); opacity:0} to{transform:scale(1); opacity:1}}
.modal-header{padding:18px 21px; border-bottom:1px solid var(--border); font-size:17px; font-weight:800}
.modal-body{padding:20px 21px; display:flex; flex-direction:column; gap:13px; overflow-y:auto}
.modal-footer{padding:15px 21px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-start}
.field{display:flex; flex-direction:column; gap:6px}
.field label{font-size:12.5px; color:var(--muted); font-weight:700}
.field input,.field select,.field textarea{padding:10px 12px; border:1px solid var(--border); border-radius:9px; font-size:14px; background:var(--surface); color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%, transparent); border-color:var(--primary)}
.field-row{display:flex; gap:12px} .field-row .field{flex:1}
.field-row-3{display:flex; gap:12px} .field-row-3 .field{flex:1}
@media (max-width:560px){ .field-row,.field-row-3{flex-direction:column} }

/* Bars & chart */
.bar-row{display:flex; align-items:center; gap:12px; margin-bottom:11px; font-size:13.5px}
.bar-label{width:130px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{flex:1; background:var(--chip); border-radius:999px; height:11px; overflow:hidden}
.bar-fill{height:100%; border-radius:999px; background:var(--primary)}
.bar-value{width:96px; flex-shrink:0; text-align:left; color:var(--muted)}
.legend{display:flex; gap:18px; margin-top:8px; font-size:12.5px; color:var(--muted); justify-content:center}
.legend span{display:inline-flex; align-items:center; gap:6px}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block}

/* Review */
.hintbar{font-size:13px; color:var(--muted); margin-bottom:14px}
.review-card{border:1px solid var(--border); border-radius:13px; padding:15px 16px; margin-bottom:11px; background:var(--surface); box-shadow:var(--shadow)}
.review-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px}
.review-merchant{font-weight:800; font-size:15.5px}
.review-meta{font-size:12.5px; color:var(--muted); margin-top:2px}
.review-amount{font-size:19px; font-weight:800; color:var(--red); white-space:nowrap}
.cat-chips{display:flex; flex-wrap:wrap; gap:7px}
.cat-chip{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 13px; cursor:pointer; font-size:13px; font-weight:700; transition:.12s; display:inline-flex; align-items:center; gap:6px}
.cat-chip:hover{border-color:var(--primary); background:var(--surface-2)}
.cat-chip .cdot{width:9px; height:9px; border-radius:50%}
.review-actions{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
.chk{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}

/* Import */
.drop{border:2px dashed var(--border); border-radius:14px; padding:34px; text-align:center; color:var(--muted); background:var(--surface-2); cursor:pointer; transition:.15s}
.drop:hover,.drop.drag{border-color:var(--primary); color:var(--primary-strong)}
.map-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); gap:12px; margin:16px 0}
.preview-table{max-height:300px; overflow:auto; border:1px solid var(--border); border-radius:10px}
.preview-table table{font-size:12.5px} .preview-table th{position:sticky; top:0}
.section-title{font-size:15px; font-weight:800; margin:22px 0 12px}

/* Cards grid */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:14px}
.mini-card{background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:15px 16px; box-shadow:var(--shadow)}
.mini-card h4{font-size:15px; margin:0 0 7px}
.mini-card .row{font-size:13px; color:var(--muted); margin:3px 0}
.stars{color:var(--amber); letter-spacing:2px} .stars .off{opacity:.3}
.contact-actions{margin-top:11px; display:flex; gap:8px; align-items:center}
.cat-select{padding:6px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-size:13px; font-weight:600; max-width:210px; cursor:pointer}
.cat-select:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent); border-color:var(--primary)}
.cat-select.unset{border-color:var(--red); color:var(--red); background:color-mix(in srgb,var(--red) 9%,transparent); font-weight:800}
.link{color:var(--primary); text-decoration:none; font-weight:700; cursor:pointer}
.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.hint{font-size:12px; color:var(--muted); margin-top:4px}
.bulb-thumb{width:44px; height:44px; border-radius:9px; object-fit:cover; border:1px solid var(--border); cursor:zoom-in; display:inline-block; vertical-align:middle; background:var(--surface-2)}
.empty-thumb{display:inline-flex; align-items:center; justify-content:center; font-size:20px; cursor:default}
.img-uploader{display:flex; gap:14px; align-items:flex-start}
.img-prev{width:96px; height:96px; flex-shrink:0; border:1px solid var(--border); border-radius:11px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:12px}
.img-prev img{width:100%; height:100%; object-fit:cover}
.img-file{font-size:13px; color:var(--text)}
code{background:var(--chip); padding:2px 6px; border-radius:5px; font-size:13px}

/* Toast */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px); background:#12211e; color:#fff; padding:12px 22px; border-radius:11px; box-shadow:0 10px 28px rgba(0,0,0,.3); opacity:0; transition:.28s; z-index:100; font-weight:600; max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0); opacity:1}
.toast.error{background:var(--red); color:#fff}

/* Responsive nav */
@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{width:100%; height:auto; position:static; flex-direction:row; align-items:center; padding:10px 12px; gap:10px; overflow-x:auto}
  .brand{padding:0 8px 0 4px; flex-shrink:0}
  .brand-sub{display:none}
  nav{flex-direction:row; gap:4px}
  nav a{white-space:nowrap; padding:8px 11px}
  nav a span:not(.ico){display:none}
  nav a.active span:not(.ico){display:inline}
  .sidebar-foot{display:none}
  .view{padding:18px 16px}
  .topbar{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo">🏡</span>
      <span><span class="brand-name">ניהול הבית</span><span class="brand-sub">450 מ״ר · בריכה · גינה</span></span>
    </div>
    <nav id="nav">
      <a data-view="dashboard"><span class="ico">📊</span> <span>דשבורד</span></a>
      <a data-view="analytics"><span class="ico">📈</span> <span>גרפים וניתוח</span></a>
      <a data-view="transactions"><span class="ico">💳</span> <span>עסקאות</span></a>
      <a data-view="review"><span class="ico">🏷️</span> <span>סיווג עסקאות</span></a>
      <a data-view="import"><span class="ico">📥</span> <span>ייבוא תדפיסים</span></a>
      <a data-view="reconcile"><span class="ico">✅</span> <span>השלמות אשראי</span></a>
      <a data-view="recurring"><span class="ico">🔁</span> <span>הוצאות קבועות</span></a>
      <a data-view="maintenance"><span class="ico">🛠️</span> <span>תחזוקה</span></a>
      <a data-view="warranties"><span class="ico">📜</span> <span>אחריות</span></a>
      <a data-view="professionals"><span class="ico">👷</span> <span>בעלי מקצוע</span></a>
      <a data-view="lighting"><span class="ico">💡</span> <span>תאורה</span></a>
      <a data-view="categories"><span class="ico">🗂️</span> <span>קטגוריות</span></a>
    </nav>
    <div class="sidebar-foot">
      <span id="save-state">נשמר בדפדפן</span>
      <button class="theme-btn" id="theme-toggle" title="החלף מצב תצוגה">🌗</button>
    </div>
  </aside>
  <main class="content">
    <header class="topbar">
      <h1 id="page-title">דשבורד</h1>
      <div class="month-picker" id="month-wrap">
        <label for="month-filter">חודש:</label>
        <input type="month" id="month-filter" />
        <button id="clear-month" class="btn-ghost" style="padding:6px 12px">הכל</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
/* ============================ Local data store ============================ */
const LS_KEY = 'home-mgmt-v1';
let db;
function seedDB(){
  const cats = [];
  let seq = 0;
  const addCat = (name,color,kind='expense',is_home=1)=>cats.push({id:++seq,name,kind,is_home,color,monthly_budget:0});
  [['חשמל','#f59e0b'],['מים וביוב','#0ea5e9'],['גז','#ef4444'],['ארנונה','#8b5cf6'],['ועד בית','#6366f1'],
   ['אינטרנט וטלוויזיה','#3b82f6'],['טלפון וסלולר','#06b6d4'],['ביטוח דירה ומבנה','#14b8a6'],
   ['בריכה – תחזוקה','#0891b2'],['בריכה – כימיקלים','#22d3ee'],['גינון ותחזוקת גינה','#16a34a'],
   ['השקיה וצמחייה','#65a30d'],['ניקיון ועזרת בית','#a855f7'],['תיקונים ותחזוקה','#d97706'],
   ['מכשירי חשמל וריהוט','#e11d48'],['אבטחה ומיגון','#475569'],['מזון וסופר','#f97316'],
   ['דלק ורכב','#84cc16'],['מיסים ואגרות','#7c3aed'],['אחר','#6b7280']].forEach(([n,c])=>addCat(n,c));
  addCat('משכורת','#15803d','income',0);
  addCat('הכנסה אחרת','#22c55e','income',0);
  addCat('העברה בין חשבונות','#94a3b8','expense',0);
  return {seq, categories:cats, rules:[], transactions:[], recurring:[], professionals:[], warranties:[], components:[], maintenance:[], lighting:[]};
}
function loadDB(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
  const fresh = seedDB();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(fresh)); }catch(e){}
  return fresh;
}
let saveTimer;
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(db));
    const s=document.getElementById('save-state'); if(s){ s.textContent='נשמר ✔'; clearTimeout(saveTimer); saveTimer=setTimeout(()=>s.textContent='נשמר בדפדפן',1500);} }
  catch(e){ /* storage unavailable — stays in memory for session */ }
}
db = loadDB();
const uid = ()=> ++db.seq;
const clone = (x)=> JSON.parse(JSON.stringify(x));

/* date helpers replicating server SQL */
function addMonths(iso, n){
  if(!iso) return null;
  const [y,m,d] = String(iso).slice(0,10).split('-').map(Number);
  const dt = new Date(Date.UTC(y, (m-1)+Number(n||0), d));
  return dt.toISOString().slice(0,10);
}
function daysLeft(iso){ if(!iso) return null; return Math.floor((Date.parse(iso+'T00:00:00Z') - Date.now())/86400000); }
const inMonth = (iso,month)=> !month || (String(iso).slice(0,7)===month);
const numv=(v)=> (v===undefined||v===null||v==='')?0:Number(v);
const strv=(v)=> (v===undefined||v===null)?'':String(v).trim();
const intOrNull=(v)=> (v===undefined||v===null||v==='')?null:parseInt(v,10);

function matchCategory(text, kind){
  const hay = strv(text).toLowerCase();
  let rules=[...db.rules];
  // התאמה רק לקטגוריות מאותו סוג (הוצאה→הוצאה, הכנסה→הכנסה) כשמצוין
  if(kind){ rules=rules.filter(r=>{ const c=catById(r.category_id); return c && c.kind===kind; }); }
  rules.sort((a,b)=>strv(b.match_text).length-strv(a.match_text).length); // ספציפי קודם לכללי
  for(const r of rules){ const mt=strv(r.match_text).toLowerCase(); if(mt && hay.includes(mt)) return r.category_id; }
  return null;
}

// זיהוי חברות אשראי (לצורך מסך השלמות)
const CARD_ISSUERS=['ישראכרט','אמריקן אקספרס','אמריקן','אמקס','לאומי קארד','דיינרס','כאל','מקס','ויזה'];
function normIssuer(k){ return (k==='אמריקן'||k==='אמקס')?'אמריקן אקספרס':k; }
function detectIssuer(text){ const t=strv(text); for(const k of CARD_ISSUERS){ if(k && t.includes(k)) return normIssuer(k); } return null; }
const AGG_CAT='כרטיסי אשראי (חיוב מרוכז)';
// השוואת חיוב-בנק מול פירוט-אשראי לכל חברה
function reconciliation(){
  const iss={};
  const get=(k)=> (iss[k]=iss[k]||{issuer:k,bank:0,card:0,bankCount:0,cardCount:0});
  db.transactions.forEach(t=>{ if(t.kind!=='expense') return;
    if(t.source==='credit_card'){ const k=detectIssuer(t.account)||detectIssuer(t.merchant)||(strv(t.account)||'כרטיס אשראי'); const g=get(k); g.card+=t.amount; g.cardCount++; }
    else { const k=detectIssuer(t.merchant)||detectIssuer(t.description); if(k){ const g=get(k); g.bank+=t.amount; g.bankCount++; } }
  });
  return Object.values(iss).map(g=>{ g.gap=g.bank-g.card; g.pct=g.bank>0?Math.min(100,Math.round(g.card/g.bank*100)):(g.card>0?100:0);
    g.status = g.bank===0 ? 'card_only' : g.card===0 ? 'pending' : Math.abs(g.gap)<=Math.max(2,g.bank*0.02) ? 'done' : 'partial'; return g; })
    .sort((a,b)=>b.bank-a.bank);
}
// מפת סטטוס השלמה לכל חברת אשראי
function issuerStatusMap(){ const map={}; reconciliation().forEach(r=>map[r.issuer]=r.status); return map; }
// האם עסקה נספרת בסכום הכולל (מונע ספירה כפולה של חיוב-אשראי מרוכז מול פירוט):
//  - פירוט אשראי נספר רק כשההשלמה הסתיימה (done) או שאין חיוב-בנק תואם (card_only)
//  - חיוב-בנק מרוכז נספר תמיד, אלא אם הפירוט כבר הושלם ומחליף אותו
function countsInTotal(t, stMap){
  if(t.kind!=='expense') return true;
  if(t.source==='credit_card'){ const k=detectIssuer(t.account)||detectIssuer(t.merchant); if(!k) return true; const st=stMap[k]; return st==='done'||st==='card_only'; }
  const k=detectIssuer(t.merchant)||detectIssuer(t.description); if(!k) return true; return stMap[k]!=='done';
}

/* ============================ Local "API" ============================ */
async function api(path, opts={}){
  const method=(opts.method||'GET').toUpperCase();
  const b=opts.body||{};
  const [rawPath,query]=path.split('?');
  const qp=Object.fromEntries(new URLSearchParams(query||''));
  const parts=rawPath.split('/').filter(Boolean);
  const res = route(parts, method, b, qp);
  save();
  return res;
}
function route(parts, method, b, qp){
  const [res, id, sub] = parts;
  switch(res){
    case 'categories': return h_categories(method,id,b);
    case 'rules': return h_rules(method,id,b);
    case 'transactions': return h_transactions(method,id,sub,b,qp);
    case 'professionals': return h_professionals(method,id,b);
    case 'warranties': return h_warranties(method,id,b);
    case 'components': return h_components(method,id,sub,b);
    case 'recurring': return h_recurring(method,id,b);
    case 'lighting': return h_lighting(method,id,b);
    case 'dashboard': return h_dashboard(qp);
    case 'reconcile': return reconciliation();
  }
  throw new Error('נתיב לא נמצא');
}

function h_categories(m,id,b){

  if(m==='POST'){ if(!strv(b.name)) throw new Error('שם הקטגוריה הוא שדה חובה');
    const c={id:uid(),name:strv(b.name),kind:b.kind==='income'?'income':'expense',is_home:(b.is_home===false||b.is_home===0)?0:1,color:strv(b.color)||'#0f766e',monthly_budget:numv(b.monthly_budget)};
    db.categories.push(c); return c; }
  if(m==='PUT'){ const c=catById(id); if(!c) throw new Error('לא נמצא'); if(!strv(b.name)) throw new Error('שם הקטגוריה הוא שדה חובה');
    Object.assign(c,{name:strv(b.name),kind:b.kind==='income'?'income':'expense',is_home:(b.is_home===false||b.is_home===0)?0:1,color:strv(b.color)||'#0f766e',monthly_budget:numv(b.monthly_budget)}); return c; }
  if(m==='DELETE'){ db.categories=db.categories.filter(c=>c.id!=id); db.rules=db.rules.filter(r=>r.category_id!=id);
    db.transactions.forEach(t=>{ if(t.category_id==id) t.category_id=null; }); return {ok:true}; }
}

    const r={id:uid(),match_text:strv(b.match_text),category_id:intOrNull(b.category_id)}; db.rules.push(r); return {id:r.id}; }

function txView(t){ const c=catById(t.category_id); return {...t, category_name:c?.name||null, category_color:c?.color||null, is_home:c?c.is_home:null}; }
function h_transactions(m,id,sub,b,qp){
  if(id==='import'){ // POST
    if(!Array.isArray(b.rows)||!b.rows.length) throw new Error('אין שורות לייבוא');
    const src=strv(b.source)||'credit_card', acct=strv(b.account);
    const existing=new Set(db.transactions.map(t=>t.hash).filter(Boolean));
    let added=0,skipped=0,autoCategorized=0;
    for(const r of b.rows){
      const date=strv(r.date), desc=strv(r.description), merchant=strv(r.merchant||r.description);
      const amount=Math.abs(numv(r.amount)); if(!date||amount<=0){skipped++;continue;}
      const kind=r.kind==='income'?'income':'expense';
      const hash=[src,acct,date,desc,amount,kind].join('|');
      if(existing.has(hash)){skipped++;continue;}
      const cat=matchCategory(desc+' '+merchant, kind); if(cat) autoCategorized++;
      db.transactions.push({id:uid(),tx_date:date,source:src,account:acct,description:desc,merchant,amount,kind,category_id:cat,notes:'',hash});
      existing.add(hash); added++;
    }
    return {added,skipped,autoCategorized};
  }
  if(id==='bulk-delete'){ const {source,account,month}=b; db.transactions=db.transactions.filter(t=>!((!source||t.source===source)&&(!account||t.account===account)&&(!month||inMonth(t.tx_date,month)))); return {ok:true}; }
  if(id==='classify'){ // סיווג קבוצתי לפי רשימת מזהים
    const ids=(b.ids||[]).map(String); const cat=intOrNull(b.category_id);
    let n=0; db.transactions.forEach(t=>{ if(ids.includes(String(t.id))){ t.category_id=cat; n++; } });
    if(b.make_rule && cat){ const key=strv(b.rule_text); if(key && !db.rules.some(r=>r.match_text===key && r.category_id===cat)) db.rules.push({id:uid(),match_text:key,category_id:cat}); }
    return {ok:true,count:n};
  }
  if(id==='auto'){ // החלת כל הכללים על עסקאות שטרם סווגו (הוצאות והכנסות כאחד)
    let n=0; db.transactions.forEach(t=>{ if(!t.category_id){ const c=matchCategory((t.description||'')+' '+(t.merchant||''), t.kind); if(c){ t.category_id=c; n++; } } });
    return {classified:n};
  }
  if(m==='GET' && !id){
    let rows=db.transactions.filter(t=> inMonth(t.tx_date,qp.month)
      && (!qp.category_id || t.category_id==qp.category_id)
      && (qp.status!=='uncategorized' || !t.category_id)
      && (!qp.source || t.source===qp.source)
      && (!qp.kind || t.kind===qp.kind));
    rows=rows.map(txView).sort((a,c)=> (c.tx_date>a.tx_date?1:c.tx_date<a.tx_date?-1:c.id-a.id));
    return rows;
  }
  if(m==='POST'){ if(!strv(b.tx_date)) throw new Error('יש להזין תאריך'); if(numv(b.amount)<=0) throw new Error('יש להזין סכום חיובי');
    const t={id:uid(),tx_date:strv(b.tx_date),source:strv(b.source)||'manual',account:strv(b.account),description:strv(b.description),merchant:strv(b.merchant),amount:numv(b.amount),kind:b.kind==='income'?'income':'expense',category_id:intOrNull(b.category_id),notes:strv(b.notes),hash:null};
    db.transactions.push(t); return {id:t.id}; }
  if(m==='PATCH'){ const t=db.transactions.find(x=>x.id==id); if(!t) throw new Error('העסקה לא נמצאה');
    const category_id = b.category_id===undefined? t.category_id : intOrNull(b.category_id);
    if(b.tx_date!==undefined) t.tx_date=strv(b.tx_date);
    if(b.account!==undefined) t.account=strv(b.account);
    if(b.description!==undefined) t.description=strv(b.description);
    if(b.merchant!==undefined) t.merchant=strv(b.merchant);
    if(b.amount!==undefined) t.amount=numv(b.amount);
    if(b.kind!==undefined) t.kind=b.kind==='income'?'income':'expense';
    if(b.notes!==undefined) t.notes=strv(b.notes);
    t.category_id=category_id;
    if(b.make_rule && category_id){ const key=strv(b.rule_text||t.merchant||t.description); if(key) db.rules.push({id:uid(),match_text:key,category_id}); }
    return txView(t); }
  if(m==='DELETE'){ db.transactions=db.transactions.filter(t=>t.id!=id); return {ok:true}; }
}

function h_dashboard(qp){
  const month=qp.month;
  const stMap=issuerStatusMap();
  const exp=db.transactions.filter(t=>t.kind==='expense'&&inMonth(t.tx_date,month)&&countsInTotal(t,stMap));
  const inc=db.transactions.filter(t=>t.kind==='income'&&inMonth(t.tx_date,month));
  const homeExp=exp.filter(t=>{const c=catById(t.category_id); return c&&c.is_home;});
  const homeExpenses=homeExp.reduce((s,t)=>s+t.amount,0);
  const totalExpenses=exp.reduce((s,t)=>s+t.amount,0);
  const totalIncome=inc.reduce((s,t)=>s+t.amount,0);
  const uncategorized=exp.filter(t=>!t.category_id).length;
  const catMap={};
  homeExp.forEach(t=>{const c=catById(t.category_id); if(!catMap[c.id])catMap[c.id]={name:c.name,color:c.color,total:0}; catMap[c.id].total+=t.amount;});
  const byCategory=Object.values(catMap).filter(x=>x.total>0).sort((a,c)=>c.total-a.total);
  const perMonth={monthly:1,bimonthly:0.5,quarterly:1/3,yearly:1/12};
  const recurringMonthly=db.recurring.filter(r=>r.active).reduce((s,r)=>s+r.amount*(perMonth[r.frequency]||1),0);
  // trend last 6 months
  const now=new Date(); const trend=[];
  for(let i=5;i>=0;i--){ const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-i,1)); const m=d.toISOString().slice(0,7);
    const e=db.transactions.filter(t=>t.kind==='expense'&&String(t.tx_date).slice(0,7)===m&&(catById(t.category_id)?.is_home)).reduce((s,t)=>s+t.amount,0);
    const ic=db.transactions.filter(t=>t.kind==='income'&&String(t.tx_date).slice(0,7)===m).reduce((s,t)=>s+t.amount,0);
    trend.push({m,expenses:e,income:ic}); }
  const upcomingMaintenance=db.components.map(compView).filter(c=>c.next_due&&c.days_left<=60).sort((a,c)=>a.next_due.localeCompare(c.next_due)).slice(0,8);
  const expiringWarranties=db.warranties.map(warrantyView).filter(w=>w.effective_expiry&&w.days_left<=90).sort((a,c)=>a.effective_expiry.localeCompare(c.effective_expiry)).slice(0,8);
  // השלמות: חיובי אשראי בבנק שממתינים לפירוט
  const recon=reconciliation();
  const pending=recon.filter(r=>r.status==='pending'||r.status==='partial');
  const pendingCredit=pending.reduce((s,r)=>s+Math.max(0,r.gap),0);
  const totalBankCard=recon.reduce((s,r)=>s+r.bank,0);
  const completeness = totalBankCard>0 ? Math.round((1 - pendingCredit/totalBankCard)*100) : 100;
  return {month:month||'all',homeExpenses,totalExpenses,totalIncome,uncategorized,recurringMonthly,annualProjection:recurringMonthly*12,byCategory,trend,upcomingMaintenance,expiringWarranties,
    pendingCredit,pendingIssuers:pending.length,completeness};
}

function openModal(title,fieldsHTML,onSubmit,{wide=false,submitLabel='שמירה'}={}){
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
  backdrop.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="modal-header">${title}</div><form class="modal-form" style="display:flex;flex-direction:column;overflow:hidden"><div class="modal-body">${fieldsHTML}</div><div class="modal-footer"><button type="submit" class="btn">${submitLabel}</button><button type="button" class="btn-ghost" data-close>ביטול</button></div></form></div>`;
  document.body.appendChild(backdrop);
  const close=()=>backdrop.remove();
  backdrop.addEventListener('click',e=>{ if(e.target===backdrop||e.target.hasAttribute('data-close')) close(); });
  backdrop.querySelector('.modal-form').addEventListener('submit',async e=>{ e.preventDefault(); const fd=Object.fromEntries(new FormData(e.target).entries()); try{ await onSubmit(fd); close(); }catch(err){ toast(err.message,true); } });
  backdrop.querySelector('input,select,textarea')?.focus();
}

function barsHTML(items,fmt){ if(!items.length) return '<div class="empty">אין נתונים</div>'; const max=Math.max(...items.map(i=>i.value),1);
  return items.map(i=>`<div class="bar-row"><div class="bar-label" title="${esc(i.label)}">${esc(i.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${(i.value/max*100).toFixed(1)}%;${i.color?'background:'+esc(i.color):''}"></div></div><div class="bar-value tnum">${fmt(i.value)}</div></div>`).join(''); }
function trendChart(trend){ if(!trend.length) return '<div class="empty">אין נתונים</div>';
  const W=460,H=200,pad=34; const max=Math.max(...trend.flatMap(t=>[t.expenses,t.income]),1); const n=trend.length; const bw=(W-pad*2)/n;
  const y=v=>H-pad-(v/max)*(H-pad*2); const x=i=>W-pad-bw*(i+0.5);
  const line=(key,color)=>{ const pts=trend.map((t,i)=>`${x(i)},${y(t[key])}`).join(' '); const dots=trend.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t[key])}" r="3.5" fill="${color}"/>`).join(''); return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5"/>${dots}`; };
  const labels=trend.map((t,i)=>{ const [yy,mm]=t.m.split('-'); return `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".55">${mm}/${yy.slice(2)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" preserveAspectRatio="xMidYMid meet"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="currentColor" opacity=".15"/>${line('expenses','#e0654a')}${line('income','#2f9e6f')}${labels}</svg><div class="legend"><span><span class="dot" style="background:#e0654a"></span> הוצאות בית</span><span><span class="dot" style="background:#2f9e6f"></span> הכנסות</span></div>`; }
function donut(items){
  items=items.filter(i=>i.value>0);
  if(!items.length) return '<div class="empty">אין נתונים</div>';
  const total=items.reduce((s,i)=>s+i.value,0);
  const cx=90,cy=90,rad=58,C=2*Math.PI*rad,sw=26; let acc=0;
  const segs=items.map(i=>{ const dash=i.value/total*C; const s=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="${esc(i.color)}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`; acc+=dash; return s; }).join('');
  const legend=items.slice(0,10).map(i=>`<div class="bar-row" style="margin-bottom:6px"><span class="dot" style="background:${esc(i.color)}"></span><div class="bar-label" style="width:auto;flex:1" title="${esc(i.label)}">${esc(i.label)}</div><div class="bar-value tnum" style="width:auto">${money(i.value)} · ${Math.round(i.value/total*100)}%</div></div>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:170px;height:170px;flex-shrink:0">${segs}<text x="90" y="86" text-anchor="middle" font-size="12" fill="currentColor" opacity=".55">סה״כ</text><text x="90" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${money(total)}</text></svg><div style="flex:1;min-width:180px">${legend}</div></div>`;
}

    if(filtered.length){ const sE=filtered.filter(r=>r.kind==='expense').reduce((s,r)=>s+r.amount,0), sI=filtered.filter(r=>r.kind==='income').reduce((s,r)=>s+r.amount,0);

function wireIssuerUploads(el){
  el.querySelectorAll('input[type=file][data-issuer]').forEach(inp=>inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return; const issuer=inp.dataset.issuer;
    const lbl=inp.closest('label'); const old=lbl?lbl.firstChild.textContent:''; if(lbl) lbl.firstChild.textContent='מעבד… ⏳';
    try{ const res=await quickImportFile(file,'credit_card',issuer);
      if(res.error){ toast(res.error,true); if(lbl) lbl.firstChild.textContent=old; return; }
      toast(`יובאו ${res.added} עסקאות מפירוט ${issuer} (${res.skipped} כפולות)`); render();
    }catch(e){ toast('שגיאה: '+e.message,true); if(lbl) lbl.firstChild.textContent=old; }
  });
}

views.import=async()=>{

function parseCSV(text){ text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  const nl=text.indexOf('\n'); const firstLine=text.slice(0,nl>-1?nl:text.length);
  const delim=[['\t',(firstLine.match(/\t/g)||[]).length],[';',(firstLine.match(/;/g)||[]).length],[',',(firstLine.match(/,/g)||[]).length]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let field='',row=[],inQ=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
    else if(ch==='"') inQ=true; else if(ch===delim){ row.push(field); field=''; } else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; } else field+=ch; }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  const data=rows.filter(r=>r.some(c=>c&&c.trim())); if(!data.length) return {headers:[],rows:[]};
  let hIdx=data.findIndex(r=>r.filter(c=>c&&c.trim()).length>=2); if(hIdx<0)hIdx=0;
  return {headers:data[hIdx].map(h=>h.trim()),rows:data.slice(hIdx+1)}; }
function guessColumns(headers){ const find=(words,def)=>{ const i=headers.findIndex(h=>words.some(w=>h&&h.includes(w))); return i>=0?i:def; };
  return { date:find(['תאריך','date','יום'],0), desc:find(['תיאור','בית עסק','שם בית','פירוט','merchant','description','עסק'],1), amount:find(['סכום','חיוב','amount','זכות','חובה','ש"ח','₪'],headers.length-1) }; }
function parseAmount(v){ if(v==null) return 0; let s=String(v).replace(/[₪,\s]/g,'').replace(/["']/g,''); let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);} if(s.includes('-')){neg=true;s=s.replace(/-/g,'');}
  const n=parseFloat(s); if(isNaN(n))return 0; return neg?-n:n; }
function normDate(v){ if(!v) return ''; const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/))){ let y=m[3]; if(y.length===2)y='20'+y; return `${y}-${p2(m[2])}-${p2(m[1])}`; }
  return ''; }
const p2=n=>String(n).padStart(2,'0');

// ייבוא מהיר של קובץ (CSV/PDF) ללא מסך התאמה — לשימוש בכפתור "העלה פירוט"
function quickImportFile(file, source, account){
  return new Promise((resolve,reject)=>{
    const isPdf=/\.pdf$/i.test(file.name)||file.type==='application/pdf';
    const reader=new FileReader();
    reader.onload=async()=>{ try{
      let rows;
      if(isPdf){ const items=await extractPdfTransactions(reader.result); rows=items.map(i=>({date:i.date,description:i.description,merchant:i.description,amount:i.amount,kind:i.kind||'expense'})); }
      else { const {headers,rows:data}=parseCSV(reader.result); const g=guessColumns(headers);
        rows=data.map(r=>({date:normDate(r[g.date]),description:(r[g.desc]||'').trim(),merchant:(r[g.desc]||'').trim(),amount:Math.abs(parseAmount(r[g.amount])),kind:'expense'})).filter(r=>r.date&&r.amount>0); }
      if(!rows||!rows.length){ resolve({added:0,error:'לא זוהו עסקאות בקובץ — נסו לייצא כ‑CSV, או השתמשו במסך «ייבוא תדפיסים».'}); return; }
      const res=await api('/transactions/import',{method:'POST',body:{source,account,rows}});
      resolve(res);
    }catch(e){ reject(e); } };
    if(isPdf) reader.readAsArrayBuffer(file); else reader.readAsText(file,'utf-8');
  });
}

/* ===== PDF text extraction (native, no external libraries) ===== */
function bytesToLatin1(u8){ let s=''; const CH=0x8000; for(let i=0;i<u8.length;i+=CH){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); } return s; }
async function inflateBytes(u8){
  if(typeof DecompressionStream==='undefined') return null;
  for(const fmt of ['deflate','deflate-raw']){
    try{ const ds=new DecompressionStream(fmt); const buf=await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer(); const out=new Uint8Array(buf); if(out.length) return out; }catch(e){}
  }
  return null;
}
// מפענח מחרוזת PDF ((literal) או <hex>) לטקסט
function readPdfLiteral(s,i){ // i points at '('
  let depth=0,out='';
  for(;i<s.length;i++){ const c=s[i];
    if(c==='\\'){ const n=s[i+1];
      if(n==='n')out+='\n'; else if(n==='r')out+='\r'; else if(n==='t')out+='\t'; else if(n==='b')out+='\b'; else if(n==='f')out+='\f';
      else if(n>='0'&&n<='7'){ let oct=n; let k=i+2; while(k<s.length&&s[k]>='0'&&s[k]<='7'&&oct.length<3){oct+=s[k];k++;} out+=String.fromCharCode(parseInt(oct,8)); i=k-1; continue; }
      else out+=n; i++; continue; }
    if(c==='('){ depth++; out+=c; continue; }
    if(c===')'){ if(depth===0){ return [out,i+1]; } depth--; out+=c; continue; }
    out+=c;
  }
  return [out,i];
}
function readPdfHex(s,i){ // i points at '<'
  let j=s.indexOf('>',i); if(j<0)j=s.length; let hex=s.slice(i+1,j).replace(/[^0-9a-fA-F]/g,'');
  if(hex.length%2)hex+='0'; let out=''; for(let k=0;k<hex.length;k+=2){ out+=String.fromCharCode(parseInt(hex.substr(k,2),16)); }
  return [out,j+1];
}
// מכפלת מטריצות אפיניות של PDF ([a b c d e f])
function matMul(m1,m2){ return [
  m1[0]*m2[0]+m1[1]*m2[2], m1[0]*m2[1]+m1[1]*m2[3],
  m1[2]*m2[0]+m1[3]*m2[2], m1[2]*m2[1]+m1[3]*m2[3],
  m1[4]*m2[0]+m1[5]*m2[2]+m2[4], m1[4]*m2[1]+m1[5]*m2[3]+m2[5] ]; }
// פענוח Windows‑1255 (עברית) + היפוך מסדר ויזואלי לסדר לוגי
function decodeHeb1255(s){ let o='',heb=false;
  for(const ch of s){ const c=ch.charCodeAt(0); if(c>=0xE0&&c<=0xFA){ o+=String.fromCharCode(0x05D0+(c-0xE0)); heb=true; } else o+=ch; }
  return heb ? o.split('').reverse().join('') : o; }
// מחלץ קטעי טקסט עם מיקום (x,y) מזרם תוכן, תוך מעקב אחר מטריצות הטרנספורמציה
function pdfFragments(content){
  const frags=[]; let i=0, stack=[], ctm=[1,0,0,1,0,0], ctmStack=[], tm=[1,0,0,1,0,0], tlm=[1,0,0,1,0,0], leading=0;
  const push=(v)=>stack.push(v);
  while(i<content.length){ const c=content[i];
    if(c==='('){ const [str,ni]=readPdfLiteral(content,i+1); push({s:str}); i=ni; continue; }
    if(c==='<'&&content[i+1]!=='<'){ const [str,ni]=readPdfHex(content,i); push({s:str}); i=ni; continue; }
    if(c==='['){ let j=i+1,arr=''; while(j<content.length&&content[j]!==']'){ if(content[j]==='('){ const [str,nj]=readPdfLiteral(content,j+1); arr+=str; j=nj; } else if(content[j]==='<'){ const [str,nj]=readPdfHex(content,j); arr+=str; j=nj; } else j++; } push({s:arr}); i=j+1; continue; }
    if(c==='/'){ let j=i+1; while(j<content.length&&!/[\s\/\[\]<>()]/.test(content[j]))j++; i=j; continue; }
    if(/[-+0-9.]/.test(c)){ let j=i; while(j<content.length&&/[-+0-9.eE]/.test(content[j]))j++; push(Number(content.slice(i,j))); i=j; continue; }
    if(/[A-Za-z']/.test(c)||c==='"'){ let j=i; while(j<content.length&&/[A-Za-z0-9*']/.test(content[j]))j++; let op=content.slice(i,j); if(c==='"'){op='"';j=i+1;} i=j;
      const nv=stack.filter(x=>typeof x==='number');
      if(op==='cm'){ const a=nv.slice(-6); if(a.length===6) ctm=matMul(a,ctm); }
      else if(op==='q'){ ctmStack.push(ctm.slice()); }
      else if(op==='Q'){ ctm=ctmStack.pop()||ctm; }
      else if(op==='BT'){ tm=[1,0,0,1,0,0]; tlm=tm.slice(); }
      else if(op==='Tm'){ const a=nv.slice(-6); if(a.length===6){ tm=a.slice(); tlm=a.slice(); } }
      else if(op==='Td'){ const a=nv.slice(-2); tlm=matMul([1,0,0,1,a[0]||0,a[1]||0],tlm); tm=tlm.slice(); }
      else if(op==='TD'){ const a=nv.slice(-2); leading=-(a[1]||0); tlm=matMul([1,0,0,1,a[0]||0,a[1]||0],tlm); tm=tlm.slice(); }
      else if(op==='T*'){ tlm=matMul([1,0,0,1,0,-leading],tlm); tm=tlm.slice(); }
      else if(op==='TL'){ leading=nv.slice(-1)[0]||0; }
      else if(op==='Tj'||op==='TJ'||op==="'"||op==='"'){ const so=[...stack].reverse().find(x=>x&&x.s!==undefined); if(so&&so.s.trim()){ const M=matMul(tm,ctm); frags.push({x:M[4],y:M[5],t:so.s}); } }
      stack=[]; continue; }
    i++;
  }
  return frags;
}
// מקבץ קטעים לשורות לפי קואורדינטת Y (פר-עמוד)
function pdfRows(content){
  const frags=pdfFragments(content); if(!frags.length) return [];
  frags.sort((a,b)=>b.y-a.y || a.x-b.x);
  const rows=[]; let cur=null;
  for(const f of frags){ if(!cur||Math.abs(cur.y-f.y)>4){ cur={y:f.y,items:[]}; rows.push(cur); } cur.items.push(f); }
  return rows.map(r=>{ r.items.sort((a,b)=>a.x-b.x); return r.items.map(x=>x.t.trim()).filter(Boolean); });
}
const DATE_RE=/\d{1,2}[.\/\-]\d{1,2}[.\/\-]\d{2,4}/;
const MONEY_RE=/\d{1,3}(?:,\d{3})*\.\d{2}/g;
// שורת טוקנים -> עסקה {date, description, amount, kind} או null
function rowToTx(tokens){
  const line=tokens.join(' ');
  const dm=line.match(DATE_RE); if(!dm) return null;
  const date=normDate(dm[0]); if(!date) return null;
  // מועמדי סכום: מספרים עם 2 ספרות עשרוניות; מעדיפים ללא סימן מטבע (₪/¤ = היתרה)
  let cands=[];
  tokens.forEach(t=>{ const hasCur=/[¤₪]/.test(t); const mm=t.replace(/[¤₪]/g,'').match(MONEY_RE); if(mm) mm.forEach(x=>cands.push({v:parseAmount(x),cur:hasCur})); });
  const pick=cands.find(c=>!c.cur)||cands[cands.length-1]; if(!pick) return null;
  const amount=Math.abs(pick.v); if(!amount) return null;
  // כיוון: סמן 1=זכות(הכנסה) 2=חובה(הוצאה) בתדפיסי בנק
  const hasC=tokens.includes('1'), hasD=tokens.includes('2');
  const kind=hasC&&!hasD?'income':(hasD&&!hasC?'expense':null);
  // תיאור: טוקנים טקסטואליים לאחר ניקוי תאריך/סכום/סימנים
  let parts=[];
  tokens.forEach(t=>{ let ct=t.replace(DATE_RE,' ').replace(MONEY_RE,' ').replace(/[¤₪#|*]/g,' ');
    if(/bankhapoalim|co\.il|\d{2,3}-\d{6,7}/.test(ct)) return;
    if(/[A-Za-zא-תÀ-ÿ]/.test(ct)) parts.push(decodeHeb1255(ct)); });
  const description=parts.join(' ').replace(/\s+/g,' ').trim().slice(0,80);
  return {date, description, amount:String(amount), kind};
}
async function extractPdfTransactions(arrayBuffer){
  const u8=new Uint8Array(arrayBuffer);
  const raw=bytesToLatin1(u8);
  const contents=[];
  const streamRe=/stream\r?\n/g; let m;
  while((m=streamRe.exec(raw))){
    const ds=m.index+m[0].length; const es=raw.indexOf('endstream',ds); if(es<0) continue;
    const dictStart=raw.lastIndexOf('<<',m.index); const dict=dictStart>=0?raw.slice(dictStart,m.index):'';
    let end=es; if(raw[end-1]==='\n')end--; if(raw[end-1]==='\r')end--;
    let content=null;
    if(/\/FlateDecode/.test(dict)){ const inf=await inflateBytes(u8.subarray(ds,end)); if(inf) content=bytesToLatin1(inf); }
    else if(!/\/[A-Za-z]*Decode/.test(dict)){ content=bytesToLatin1(u8.subarray(ds,end)); }
    if(content && /BT/.test(content) && /(Tj|TJ)/.test(content)) contents.push(content);
    streamRe.lastIndex=es+9;
  }
  const items=[]; const seen=new Set();
  for(const c of contents){ for(const row of pdfRows(c)){ const it=rowToTx(row); if(!it) continue;
    const key=it.date+'|'+it.amount+'|'+it.description; if(seen.has(key)) continue; seen.add(key); items.push(it); } }
  // מיון לפי תאריך (חדש קודם)
  items.sort((a,b)=> b.date.localeCompare(a.date));
  return items;
}

// הקטנת תמונה לפני שמירה ב-localStorage
function resizeImage(file,maxDim,cb){ const reader=new FileReader(); reader.onload=()=>{ const im=new Image(); im.onload=()=>{ let{width:w,height:h}=im; if(w>h&&w>maxDim){h=h*maxDim/w;w=maxDim;} else if(h>maxDim){w=w*maxDim/h;h=maxDim;} const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(im,0,0,w,h); cb(cv.toDataURL('image/jpeg',0.72)); }; im.src=reader.result; }; reader.readAsDataURL(file); }
function lightbox(src){ const bd=document.createElement('div'); bd.className='modal-backdrop'; bd.style.cursor='zoom-out'; bd.innerHTML=`<img src="${esc(src)}" style="max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.4)" alt="נורה" />`; bd.onclick=()=>bd.remove(); document.body.appendChild(bd); }

views.categories=async()=>{
  const [cats,rules]=await Promise.all([api('/categories'),api('/rules')]);
  const el=document.createElement('div');
  el.innerHTML=`<div class="card" style="margin-bottom:22px"><div class="card-header"><h2>קטגוריות</h2><button class="btn" id="add-cat">+ קטגוריה</button></div>
    <div class="table-wrap"><table><thead><tr><th>שם</th><th>סוג</th><th>אחזקת בית?</th><th>תקציב חודשי</th><th></th></tr></thead><tbody>${cats.map(c=>`<tr>
      <td><span class="dot" style="background:${esc(c.color)};margin-left:7px"></span><strong>${esc(c.name)}</strong></td><td>${c.kind==='income'?'הכנסה':'הוצאה'}</td><td>${c.is_home?'✔':'—'}</td><td class="tnum">${c.monthly_budget?money(c.monthly_budget):'—'}</td>
      <td style="text-align:left"><button class="icon-btn" data-edit="${c.id}">✏️</button><button class="btn-danger" data-del="${c.id}">🗑</button></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="card-header"><h2>כללי סיווג אוטומטי</h2><button class="btn" id="add-rule">+ כלל</button></div>
    <p class="hint" style="padding:0 19px">כשמופיע הטקסט בתיאור עסקה מיובאת, היא תסווג אוטומטית. נוצרים גם אוטומטית כשמסמנים «זכור» במסך הסיווג.</p>
    ${rules.length?`<div class="table-wrap"><table><thead><tr><th>טקסט לזיהוי</th><th>קטגוריה</th><th></th></tr></thead><tbody>${rules.map(r=>`<tr><td><code>${esc(r.match_text)}</code></td><td><span class="badge" style="background:var(--chip)">${esc(r.category_name)}</span></td><td style="text-align:left"><button class="btn-danger" data-delrule="${r.id}">🗑</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין כללים עדיין.</div>'}</div>`;
  const catForm=(c={})=>`<div class="field-row"><div class="field"><label>שם *</label><input name="name" value="${esc(c.name||'')}" required /></div><div class="field"><label>צבע</label><input name="color" type="color" value="${esc(c.color||'#0f766e')}" /></div></div>
    <div class="field-row"><div class="field"><label>סוג</label><select name="kind"><option value="expense" ${c.kind!=='income'?'selected':''}>הוצאה</option><option value="income" ${c.kind==='income'?'selected':''}>הכנסה</option></select></div><div class="field"><label>תקציב חודשי (₪)</label><input name="monthly_budget" type="number" step="0.01" min="0" value="${c.monthly_budget??''}" /></div></div>
    <div class="field"><label><input type="checkbox" name="is_home" ${c.is_home===0?'':'checked'} /> נספר בעלות אחזקת הבית</label></div>`;
  el.querySelector('#add-cat').onclick=()=>openModal('קטגוריה',catForm(),async fd=>{await api('/categories',{method:'POST',body:{...fd,is_home:fd.is_home==='on'}});toast('נוסף');render();});
  el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const c=cats.find(x=>x.id==b.dataset.edit);openModal('עריכת קטגוריה',catForm(c),async fd=>{await api('/categories/'+c.id,{method:'PUT',body:{...fd,is_home:fd.is_home==='on'}});toast('עודכן');render();});});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>confirmDelete('למחוק קטגוריה? עסקאות שסווגו אליה יישארו ללא סיווג.',async()=>{await api('/categories/'+b.dataset.del,{method:'DELETE'});toast('נמחק');render();}));
  el.querySelector('#add-rule').onclick=()=>openModal('כלל סיווג',`<div class="field"><label>טקסט לזיהוי בעסקה *</label><input name="match_text" required placeholder="לדוגמה: רמי לוי / חברת חשמל" /></div><div class="field"><label>קטגוריה *</label><select name="category_id">${categoryOptions(cats)}</select></div>`,async fd=>{await api('/rules',{method:'POST',body:fd});toast('נוסף');render();});
  el.querySelectorAll('[data-delrule]').forEach(b=>b.onclick=()=>confirmDelete('למחוק כלל זה?',async()=>{await api('/rules/'+b.dataset.delrule,{method:'DELETE'});toast('נמחק');render();}));
  return el;
};

// ===== Analytics =====
views.analytics=async()=>{
  const [rows,cats]=await Promise.all([api('/transactions'+monthParam()),api('/categories')]);
  const stMap=issuerStatusMap();
  const exp=rows.filter(t=>t.kind==='expense'&&countsInTotal(t,stMap));
  const totalExp=exp.reduce((s,t)=>s+t.amount,0);
  const catMap={}; exp.forEach(t=>{ const name=t.category_name||'ללא סיווג'; if(!catMap[name])catMap[name]={label:name,value:0,color:t.category_color||'#94a3b8'}; catMap[name].value+=t.amount; });
  const byCat=Object.values(catMap).sort((a,b)=>b.value-a.value);
  const srcColors={credit_card:'#6366f1',bank:'#0ea5e9',cash:'#16a34a',manual:'#a855f7'};
  const srcMap={}; exp.forEach(t=>{ if(!srcMap[t.source])srcMap[t.source]={label:srcLabel(t.source),value:0,color:srcColors[t.source]||'#94a3b8'}; srcMap[t.source].value+=t.amount; });
  const bySrc=Object.values(srcMap).sort((a,b)=>b.value-a.value);
  const mMap={}; exp.forEach(t=>{ const m=(t.merchant||t.description||'—'); mMap[m]=(mMap[m]||0)+t.amount; });
  const topMerch=Object.entries(mMap).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value).slice(0,10);
  const uncat=exp.filter(t=>!t.category_id).reduce((s,t)=>s+t.amount,0);
  // הכנסות
  const incRows=rows.filter(t=>t.kind==='income');
  const totalInc=incRows.reduce((s,t)=>s+t.amount,0);
  const incMap={}; incRows.forEach(t=>{ const name=t.category_name||'ללא סיווג'; if(!incMap[name])incMap[name]={label:name,value:0,color:t.category_color||'#94a3b8'}; incMap[name].value+=t.amount; });
  const byInc=Object.values(incMap).sort((a,b)=>b.value-a.value);
  const net=totalInc-totalExp;
  const el=document.createElement('div');
  el.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card income"><div class="label">💰 סך הכנסות ${state.month?'בחודש':'כולל'}</div><div class="value tnum">${money(totalInc)}</div></div>
      <div class="stat-card expense"><div class="label">💸 סך הוצאות ${state.month?'בחודש':'כולל'}</div><div class="value tnum">${money(totalExp)}</div></div>
      <div class="stat-card ${net>=0?'income':'expense'}"><div class="label">${net>=0?'📈':'📉'} מאזן (הכנסות − הוצאות)</div><div class="value tnum">${money(net)}</div></div>
      <div class="stat-card ${uncat?'warn':'accent'}"><div class="label">🏷️ הוצאות לא מסווגות</div><div class="value tnum">${money(uncat)}</div><div class="sub">${totalExp?Math.round(uncat/totalExp*100):0}% · <a class="link" data-nav="transactions">סווג ←</a></div></div>
    </div>
    <div class="panels">
      <div class="panel"><h3>הוצאות לפי מהות (קטגוריה)</h3>${donut(byCat)}</div>
      <div class="panel"><h3>הכנסות לפי מהות</h3>${donut(byInc)}</div>
      <div class="panel"><h3>הוצאות לפי מקור (אשראי / בנק / מזומן)</h3>${donut(bySrc)}</div>
      <div class="panel"><h3>הכי הרבה הוצאתי אצל…</h3>${barsHTML(topMerch,money)}</div>
      <div class="panel"><h3>פילוח הוצאות מלא</h3>${barsHTML(byCat.map(c=>({label:c.label,value:c.value,color:c.color})),money)}</div>
      <div class="panel"><h3>פילוח הכנסות מלא</h3>${barsHTML(byInc.map(c=>({label:c.label,value:c.value,color:c.color})),money)}</div>
    </div>`;
  return el;
};

// ===== Reconcile / completeness =====
views.reconcile=async()=>{
  const data=await api('/reconcile');
  const totalBank=data.reduce((s,r)=>s+r.bank,0);
  const pending=data.filter(r=>r.status==='pending'||r.status==='partial');
  const pendingSum=pending.reduce((s,r)=>s+Math.max(0,r.gap),0);
  const overall=totalBank>0?Math.round((1-pendingSum/totalBank)*100):100;
  const stPill=(st)=>({done:'<span class="pill status-ok">הושלם ✓</span>',partial:'<span class="pill status-soon">חלקי</span>',pending:'<span class="pill status-late">חסר פירוט</span>',card_only:'<span class="pill status-none">פירוט בלבד</span>'}[st]||st);
  const el=document.createElement('div');
  el.innerHTML=`
    <div class="stats-grid">
      <div class="stat-card ${overall>=99?'income':overall>=60?'warn':'expense'}"><div class="label">✅ שלמות התמונה</div><div class="value tnum">${overall}%</div><div class="sub">מתוך חיובי האשראי בבנק</div></div>
      <div class="stat-card expense"><div class="label">⏳ ממתין לפירוט</div><div class="value tnum">${money(pendingSum)}</div><div class="sub">${pending.length} חברות אשראי</div></div>
      <div class="stat-card accent"><div class="label">💳 סך חיובי אשראי בבנק</div><div class="value tnum">${money(totalBank)}</div></div>
    </div>
    <p class="hintbar">כל חיוב אשראי בתדפיס הבנק (ישראכרט, כאל, אמריקן אקספרס…) מצריך <strong>פירוט תואם</strong> מאתר חברת האשראי כדי לדעת מה נקנה בפועל. כשמייבאים את הפירוט המלא, סכומו מתקרב לחיוב שבבנק והשורה מסומנת «הושלם». ייבאו במסך «ייבוא תדפיסים» → מקור «כרטיס אשראי», ובשם החשבון כתבו את שם החברה (למשל «ישראכרט»).</p>
    <div class="card">
      ${data.length?`<div class="table-wrap"><table><thead><tr><th>חברת אשראי</th><th>חויב בבנק</th><th>יובא בפירוט</th><th>נותר לפרט</th><th>השלמה</th><th>סטטוס</th></tr></thead>
      <tbody>${data.map(r=>`<tr>
        <td><strong>${esc(r.issuer)}</strong>${r.bankCount?`<div class="hint">${r.bankCount} חיובים בבנק</div>`:''}</td>
        <td class="tnum">${r.bank?money(r.bank):'—'}</td>
        <td class="tnum">${r.card?money(r.card):'—'}${r.cardCount?`<div class="hint">${r.cardCount} עסקאות</div>`:''}</td>
        <td class="tnum ${r.status==='pending'||r.status==='partial'?'amount-neg':''}">${r.bank&&r.gap>2?money(r.gap):'—'}</td>
        <td style="min-width:130px"><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;background:${r.pct>=99?'var(--green)':r.pct>=60?'var(--amber)':'var(--red)'}"></div></div><div class="hint">${r.pct}%</div></td>
        <td>${stPill(r.status)}</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty">עדיין לא זוהו חיובי כרטיסי אשראי. ייבאו תדפיס בנק, ואז ייבאו את פירוטי כרטיסי האשראי — כאן תראו כמה מהתמונה כבר מלאה.</div>'}
    </div>`;
  return el;
};

/* ============================ Router ============================ */
const TITLES={dashboard:'דשבורד',analytics:'גרפים וניתוח',transactions:'עסקאות',review:'סיווג עסקאות',import:'ייבוא תדפיסים',reconcile:'השלמות אשראי',recurring:'הוצאות קבועות',maintenance:'תחזוקה ורכיבים',warranties:'תעודות אחריות',professionals:'בעלי מקצוע',lighting:'תאורה ונורות',categories:'קטגוריות וכללים'};
function currentView(){ const hash=location.hash.replace('#/','')||'dashboard'; return views[hash]?hash:'dashboard'; }
async function render(){
  const name=currentView();
  document.getElementById('page-title').textContent=TITLES[name];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.view===name));
  document.getElementById('month-wrap').style.visibility=MONTH_VIEWS.has(name)?'visible':'hidden';
  const container=document.getElementById('view');
  container.innerHTML='<div class="empty">טוען…</div>';
  try{ const el=await views[name](); container.innerHTML=''; container.appendChild(el); }
  catch(err){ container.innerHTML=`<div class="empty">שגיאה: ${esc(err.message)}</div>`; }
}
document.getElementById('nav').addEventListener('click',e=>{ const a=e.target.closest('a[data-view]'); if(a){ e.preventDefault(); location.hash='#/'+a.dataset.view; } });
document.addEventListener('click',e=>{ const n=e.target.closest('[data-nav]'); if(n){ e.preventDefault(); location.hash='#/'+n.dataset.nav; } });
window.addEventListener('hashchange',render);
document.getElementById('month-filter').addEventListener('change',e=>{state.month=e.target.value;render();});
document.getElementById('clear-month').addEventListener('click',()=>{state.month='';document.getElementById('month-filter').value='';render();});

/* theme toggle */
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); try{localStorage.setItem('home-theme',t);}catch(e){} }
try{ const saved=localStorage.getItem('home-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved); }catch(e){}
document.getElementById('theme-toggle').onclick=()=>{ const cur=document.documentElement.getAttribute('data-theme'); const isDark = cur? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; applyTheme(isDark?'light':'dark'); };

if(!location.hash) location.hash='#/dashboard';
render();
</script>

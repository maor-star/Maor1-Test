<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הדרך הקלה לרדת במשקל</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>" />
</head>
<body>
  <!-- Login / registration, shown until a session exists -->
  <div id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-logo">💪</span>
        <h1>הדרך הקלה לרדת במשקל</h1>
        <p>לא רק המשקל — שינוי הרכב הגוף, יום אחרי יום.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login">התחברות</button>
        <button class="auth-tab" data-mode="register">הרשמה</button>
      </div>

      <form id="auth-form">
        <label class="field register-only">
          <span>שם מלא</span>
          <input type="text" name="full_name" autocomplete="name" />
        </label>
        <label class="field">
          <span>אימייל</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>סיסמה</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <p id="auth-error" class="auth-error"></p>
        <button type="submit" class="btn btn-block" id="auth-submit">התחברות</button>
      </form>
    </div>
  </div>

  <!-- Main application shell -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">💪</span>
        <span class="brand-name">הדרך הקלה</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div id="who" class="who"></div>
        <button id="logout" class="btn-ghost btn-block">התנתקות</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <button id="menu-toggle" class="btn-ghost menu-toggle" aria-label="תפריט">☰</button>
        <h1 id="page-title">דשבורד</h1>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="confetti" class="confetti-layer" aria-hidden="true"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
